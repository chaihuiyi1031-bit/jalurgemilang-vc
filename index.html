    <div id="container"></div>

    <!-- 外部库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <script>
        (function() {
            'use strict';

            // ===== 配置 =====
            const CONFIG = {
                PARTICLE_STEP: 1.2,
                CAMERA_FPS: 15,
                FIST_THRESHOLD: 0.20,
                GAME_DURATION: 180,
                LB_PAGE_SIZE: 15,
                RECORDS_PAGE_SIZE: 15,
                CLICK_PARTICLE_RADIUS: 60,
                MAX_RECORDS: 200,
                CAMERA_TIMEOUT: 5000
            };

            // ===== 数据 =====
            const DATA = {
                1: { name: "🟡 黄色", kws: ["忠于君国"], status: [false], points: ["象征 {0}。"], uiHex: "#ffcc00" },
                2: { name: "🔵 蓝色", kws: ["团结一致"], status: [false], points: ["象征多元族群 {0}。"], uiHex: "#3399ff" },
                3: { name: "🔴 红色", kws: ["勇敢"], status: [false], points: ["象征人民 {0} 面对挑战。"], uiHex: "#ff3333" },
                4: { name: "⚪ 白色", kws: ["纯洁", "真诚"], status: [false, false], points: ["象征 {0} 和 {1}。"],
                    uiHex: "#ffffff" },
                5: { name: "🌙 新月", kws: ["伊斯兰教"], status: [false], points: ["象征 {0} 是马来西亚的联邦宗教。"],
                    uiHex: "#ffcc00" },
                6: { name: "⭐ 14角星与14道条纹", kws: ["13个州", "联邦直辖区"], status: [false, false],
                    points: ["象征 {0} 和 {1} 的团结。"], uiHex: "#ffcc00" }
            };
            const TOTAL_ITEMS = Object.keys(DATA).length;
            const UNLOCKED_STAGES = {};
            for (let key in DATA) UNLOCKED_STAGES[key] = false;

            // ===== 音频 =====
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            }

            function playDing() {
                try {
                    const ctx = initAudio();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {}
            }

            function playErrorSound() {
                try {
                    const ctx = initAudio();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {}
            }

            function playVictorySound() {
                try {
                    const ctx = initAudio();
                    [100, 400, 200, 600, 300, 800].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.12 + 0.12);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.12);
                        osc.stop(ctx.currentTime + i * 0.12 + 0.12);
                    });
                    const audio = new Audio(
                        "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3");
                    audio.volume = 0.4;
                    audio.play().catch(() => {});
                } catch (e) {}
            }

            // ===== 记录 =====
            const RECORDS_KEY = 'jalur_records';

            function getRecords() {
                try {
                    const data = localStorage.getItem(RECORDS_KEY);
                    return data ? JSON.parse(data) : [];
                } catch { return []; }
            }

            function saveRecord(record) {
                let records = getRecords();
                records.push(record);
                if (records.length > CONFIG.MAX_RECORDS) {
                    records = records.slice(-CONFIG.MAX_RECORDS);
                }
                try {
                    localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
                } catch (e) {
                    showToast('⚠️ 存储记录失败，请检查浏览器存储空间');
                }
            }

            function getLeaderboardData() {
                const records = getRecords();
                const completed = records.filter(r => r.status === 'completed');
                completed.sort((a, b) => a.score - b.score);
                return completed;
            }

            // ===== 语音匹配 =====
            function levenshtein(a, b) {
                const matrix = Array.from({ length: a.length + 1 }, (_, i) => i);
                for (let j = 1; j <= b.length; j++) {
                    let prev = matrix[0];
                    matrix[0] = j;
                    for (let i = 1; i <= a.length; i++) {
                        const temp = matrix[i];
                        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                        matrix[i] = Math.min(
                            matrix[i - 1] + 1,
                            matrix[0] + 1,
                            prev + cost
                        );
                        prev = temp;
                    }
                }
                return matrix[a.length];
            }

            function getThreshold(wordLen) {
                if (wordLen <= 3) return 0;
                if (wordLen <= 5) return 1;
                if (wordLen <= 8) return 2;
                return 3;
            }

            const VARIANT_MAP = {
                "忠于君国": ["忠于君国", "忠于君", "忠君国"],
                "团结一致": ["团结一致", "团结"],
                "勇敢": ["勇敢", "勇"],
                "纯洁": ["纯洁", "纯"],
                "真诚": ["真诚", "真"],
                "伊斯兰教": ["伊斯兰教", "伊斯兰"],
                "13个州": ["13个州", "十三个州", "13州"],
                "联邦直辖区": ["联邦直辖区", "联邦辖区", "直辖区"]
            };

            function isKeywordMatch(kw, speech) {
                const clean = s => s.replace(/[^a-z0-9\u4e00-\u9fa5]/g, '').toLowerCase();
                const cleanKw = clean(kw);
                const cleanSpeech = clean(speech);
                if (cleanSpeech.includes(cleanKw)) return true;

                const variants = VARIANT_MAP[kw] || [];
                for (let v of variants) {
                    if (cleanSpeech.includes(clean(v))) return true;
                }

                const splitWords = s => s.split(/[\s，,、。！？]+/).filter(w => w.length > 0);
                const kwWords = splitWords(cleanKw);
                const speechWords = splitWords(cleanSpeech);
                if (kwWords.length === 0 || speechWords.length < kwWords.length) return false;

                const used = new Array(speechWords.length).fill(false);
                let allMatched = true;
                for (let kwWord of kwWords) {
                    let found = false;
                    for (let i = 0; i < speechWords.length; i++) {
                        if (used[i]) continue;
                        const dist = levenshtein(kwWord, speechWords[i]);
                        const threshold = getThreshold(kwWord.length);
                        if (dist <= threshold) {
                            used[i] = true;
                            found = true;
                            break;
                        }
                    }
                    if (!found) { allMatched = false; break; }
                }
                return allMatched;
            }

            // ===== Toast =====
            let toastTimer = null;

            function showToast(msg, duration = 3000) {
                const el = document.getElementById('global-toast');
                el.textContent = msg;
                el.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    el.classList.remove('show');
                }, duration);
            }

            // ===== 游戏状态 =====
            let gameActive = false;
            let timerRAF = null;
            let gameStartTime = 0;
            let timeLeft = CONFIG.GAME_DURATION;
            let playerName = '';
            let playerSchool = '';
            let isGameFinished = false;
            let isVictory = false;
            let isCamStarted = false;
            let recGuardInterval = null;
            let victoryPlayed = false;
            let allFinishedFlag = false;

            let scene, camera, renderer, particles, particleMeta = [];
            let currentMode = 0;
            const FLAG_URL =
                "https://2.bp.blogspot.com/-eebZvbZ1IVc/VAaQ9l_EpMI/AAAAAAAAKD8/rcoJeurNglc/s1600/Bendera%2BMalaysia%2B-%2BJalur%2BGemilang.png";

            let rec = null;
            let recStarted = false;
            let isSpeechSupported = false;
            let isProcessingTranscript = false;

            let clickCooldown = false;
            let morphFactor = 0;
            let selectFactor = 0;

            let lbCurrentPage = 1;
            let recordsCurrentPage = 1;
            let recordsCurrentTab = 'all';
            let saveProgressTimer = null;

            // ================================================================
            // ★★★ 新增：显式请求麦克风权限（只影响麦克风部分） ★★★
            // ================================================================
            let micPermissionGranted = false;

            function ensureMicrophonePermission() {
                return new Promise((resolve) => {
                    if (micPermissionGranted) {
                        resolve(true);
                        return;
                    }
                    // 先检查是否已有权限
                    navigator.permissions.query({ name: 'microphone' })
                        .then((status) => {
                            if (status.state === 'granted') {
                                micPermissionGranted = true;
                                resolve(true);
                            } else if (status.state === 'prompt') {
                                // 主动请求
                                navigator.mediaDevices.getUserMedia({ audio: true })
                                    .then(stream => {
                                        stream.getTracks().forEach(t => t.stop());
                                        micPermissionGranted = true;
                                        resolve(true);
                                    })
                                    .catch(() => resolve(false));
                            } else {
                                resolve(false);
                            }
                        })
                        .catch(() => {
                            // 降级：直接请求
                            navigator.mediaDevices.getUserMedia({ audio: true })
                                .then(stream => {
                                    stream.getTracks().forEach(t => t.stop());
                                    micPermissionGranted = true;
                                    resolve(true);
                                })
                                .catch(() => resolve(false));
                        });
                });
            }

            // ================================================================
            // ★★★ 修改：语音识别初始化（增加权限检查） ★★★
            // ================================================================
            function initSpeechRecognition() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) {
                    isSpeechSupported = false;
                    document.getElementById('speech-fallback').style.display = 'flex';
                    showToast('🔊 您的浏览器不支持语音识别，请使用下方输入框提交关键词');
                    return null;
                }
                isSpeechSupported = true;
                const r = new Recognition();
                r.lang = 'zh-CN';
                r.continuous = true;
                r.interimResults = false;

                r.onresult = (e) => {
                    if (!gameActive || currentMode === 0 || isProcessingTranscript) return;
                    isProcessingTranscript = true;
                    try {
                        const lastIndex = e.results.length - 1;
                        let speech = e.results[lastIndex][0].transcript.toLowerCase().trim();
                        speech = speech.replace(/[，。、！？\s]+/g, ' ').trim();
                        handleSpeechMatch(speech);
                    } finally {
                        isProcessingTranscript = false;
                    }
                };

                r.onerror = (err) => {
                    isProcessingTranscript = false;
                    if (err.error === 'not-allowed') {
                        showToast('⚠️ 请允许使用麦克风权限');
                        micPermissionGranted = false;
                    }
                    if (!recStarted && gameActive) {
                        setTimeout(() => tryStartRecognition(), 500);
                    }
                };

                r.onend = () => {
                    isProcessingTranscript = false;
                    if (gameActive && !isGameFinished && rec) {
                        setTimeout(() => tryStartRecognition(), 300);
                    }
                };

                return r;
            }

            function setupSpeechFallback() {
                const input = document.getElementById('fallback-speech-input');
                const btn = document.getElementById('fallback-speech-btn');

                function handleFallbackSubmit() {
                    const val = input.value.trim();
                    if (!val) return;
                    if (!gameActive || currentMode === 0) {
                        showToast('请先使用手势或点击选择一个部件');
                        input.value = '';
                        return;
                    }
                    handleSpeechMatch(val);
                    input.value = '';
                    input.blur();
                }

                btn.addEventListener('click', handleFallbackSubmit);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleFallbackSubmit();
                    }
                });
                input.addEventListener('focus', () => {
                    if (!gameActive) {
                        showToast('请先开始游戏');
                        input.blur();
                    }
                });
            }

            function handleSpeechMatch(speech) {
                if (!gameActive || currentMode === 0) return;
                const data = DATA[currentMode];
                if (!data) return;

                let matchedSomething = false;

                for (let idx = 0; idx < data.kws.length; idx++) {
                    if (data.status[idx]) continue;
                    const kw = data.kws[idx];
                    if (isKeywordMatch(kw, speech)) {
                        matchedSomething = true;
                        if (!data.status[idx]) {
                            data.status[idx] = true;
                            playDing();
                            debouncedSaveProgress();
                            UNLOCKED_STAGES[currentMode] = data.status.every(s => s === true);
                            updateUI();
                            if (checkAllUnlockedAndFinish()) break;
                            if (currentMode !== 0 && !allFinishedFlag) {
                                setModeImmediate(0);
                            }
                            break;
                        }
                    }
                }

                if (!matchedSomething) {
                    playErrorSound();
                    showToast('❌ 关键词不匹配，请重新尝试');
                }
            }

            // ================================================================
            // ★★★ 修改：语音启动逻辑（先请求权限） ★★★
            // ================================================================
            function tryStartRecognition() {
                if (!rec || recStarted || !gameActive || isGameFinished) return;

                // 先确保麦克风权限已获得
                ensureMicrophonePermission().then((granted) => {
                    if (!granted) {
                        // 权限被拒，显示降级输入框
                        document.getElementById('speech-fallback').style.display = 'flex';
                        showToast('⚠️ 麦克风权限被拒绝，请使用输入框');
                        return;
                    }
                    // 权限已获，尝试启动
                    initAudio();
                    try {
                        rec.start();
                        recStarted = true;
                        document.getElementById('mic-status').style.display = 'inline-block';
                        document.getElementById('speech-fallback').style.display = 'none';
                    } catch (e) {
                        recStarted = false;
                        // 如果启动失败，稍后重试
                        setTimeout(() => {
                            if (!recStarted && rec && gameActive) {
                                tryStartRecognition();
                            }
                        }, 1000);
                    }
                });
            }

            function startGuardian() {
                if (recGuardInterval) clearInterval(recGuardInterval);
                recGuardInterval = setInterval(() => {
                    if (gameActive && !isGameFinished && rec && !recStarted) {
                        tryStartRecognition();
                    }
                }, 3000);
            }

            function stopGuardian() {
                if (recGuardInterval) {
                    clearInterval(recGuardInterval);
                    recGuardInterval = null;
                }
            }

            function stopRecognition() {
                if (rec) {
                    try { rec.stop(); } catch (e) {}
                    recStarted = false;
                }
                document.getElementById('mic-status').style.display = 'inline-block';
            }

            // ===== 进度管理 =====
            function saveProgress() {
                try {
                    const data = {};
                    for (let key in DATA) data[key] = DATA[key].status;
                    localStorage.setItem('jalur_progress', JSON.stringify(data));
                } catch (e) {}
            }

            function debouncedSaveProgress() {
                if (saveProgressTimer) clearTimeout(saveProgressTimer);
                saveProgressTimer = setTimeout(saveProgress, 200);
            }

            function loadProgress() {
                try {
                    const saved = localStorage.getItem('jalur_progress');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        for (let key in parsed) {
                            if (DATA[key] && Array.isArray(parsed[key])) {
                                DATA[key].status = parsed[key].map(v => !!v);
                                UNLOCKED_STAGES[key] = DATA[key].status.every(s => s === true);
                            }
                        }
                    }
                } catch (e) {}
            }

            function resetProgress() {
                for (let key in DATA) {
                    DATA[key].status = DATA[key].status.map(() => false);
                    UNLOCKED_STAGES[key] = false;
                }
                saveProgress();
                victoryPlayed = false;
                allFinishedFlag = false;
            }

            function checkAllUnlockedAndFinish() {
                const allDone = Object.keys(DATA).every(key => DATA[key].status.every(s => s === true));
                if (allDone) {
                    allFinishedFlag = true;
                    triggerVictory();
                }
                return allDone;
            }

            // ===== Three.js 初始化 =====
            function initScene() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
                camera.position.z = 900;
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.getElementById('container').appendChild(renderer.domElement);
            }

            function generateFallbackFlag() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                for (let i = 0; i < 14; i++) {
                    ctx.fillStyle = (i % 2 === 0) ? '#cc0000' : '#ffffff';
                    ctx.fillRect(0, i * (256 / 14), 512, 256 / 14);
                }
                ctx.fillStyle = '#003399';
                ctx.fillRect(0, 0, 180, 110);
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(65, 55, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#003399';
                ctx.beginPath();
                ctx.arc(75, 45, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                const cx = 135,
                    cy = 55,
                    outerR = 35,
                    innerR = 14,
                    spikes = 14;
                ctx.beginPath();
                for (let i = 0; i < spikes * 2; i++) {
                    const r = (i % 2 === 0) ? outerR : innerR;
                    const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                return canvas;
            }

            function loadFlag() {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = FLAG_URL;

                    const processImage = (srcImg) => {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = 512;
                            canvas.height = 256;
                            ctx.drawImage(srcImg, 0, 0, 512, 256);
                            const imgData = ctx.getImageData(0, 0, 512, 256).data;
                            const pos = [],
                                col = [];
                            const step = CONFIG.PARTICLE_STEP;
                            particleMeta = [];
                            for (let y = 0; y < 256; y += step) {
                                for (let x = 0; x < 512; x += step) {
                                    const i = (Math.floor(y) * 512 + Math.floor(x)) * 4;
                                    if (imgData[i + 3] > 128) {
                                        const vx = (x - 256) * 1.8;
                                        const vy = -(y - 128) * 1.8;
                                        pos.push(vx, vy, 0);
                                        const r = imgData[i] / 255,
                                            g = imgData[i + 1] / 255,
                                            b = imgData[i + 2] / 255;
                                        col.push(0.1, 0.1, 0.1);
                                        let gid = 0,
                                            unlockId = 0;
                                        if (r > 0.6 && g > 0.5 && b < 0.4) { gid = 1;
                                            unlockId = 1; } else if (b > 0.3 && b > r) { gid = 2;
                                            unlockId = 2; } else if (r > 0.6 && g < 0.4 && b < 0.4) { gid = 3;
                                            unlockId = 3; } else if (r > 0.8 && g > 0.8 && b > 0.8) { gid = 4;
                                            unlockId = 4; }
                                        if (gid === 1) {
                                            const dx = x - 166,
                                                dy = y - 64;
                                            if (dx * dx + dy * dy < 2800) { gid = 7;
                                                unlockId = 6; } else { gid = 5;
                                                unlockId = 5; }
                                        }
                                        particleMeta.push({ ox: vx, oy: vy, type: gid, unlockId, r, g, b, wx: vx,
                                            wy: vy });
                                    }
                                }
                            }
                            const geo = new THREE.BufferGeometry();
                            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                            geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
                            particles = new THREE.Points(geo, new THREE.PointsMaterial({
                                size: 3,
                                vertexColors: true,
                                transparent: true,
                                blending: THREE.AdditiveBlending
                            }));
                            scene.add(particles);
                            resolve();
                        } catch (e) { resolve(); }
                    };

                    img.onload = () => { processImage(img); };
                    img.onerror = () => {
                        const fallback = generateFallbackFlag();
                        const fbImg = new Image();
                        fbImg.src = fallback.toDataURL();
                        fbImg.onload = () => { processImage(fbImg); };
                        fbImg.onerror = () => { resolve(); };
                    };
                    setTimeout(() => {
                        if (!particles) {
                            const fallback = generateFallbackFlag();
                            const fbImg = new Image();
                            fbImg.src = fallback.toDataURL();
                            fbImg.onload = () => { processImage(fbImg); };
                            fbImg.onerror = () => { resolve(); };
                        }
                    }, 5000);
                });
            }

            // ===== 手势识别 =====
            function startGestureOnly() {
                if (isCamStarted) return;
                isCamStarted = true;

                if (!rec) {
                    rec = initSpeechRecognition();
                    if (rec) setupSpeechFallback();
                }

                const hands = new Hands({
                    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
                });
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((res) => {
                    try {
                        let newMode = 0;
                        let isFist = false;
                        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                            const marks = res.multiHandLandmarks[0];
                            const f = [
                                marks[8].y < marks[6].y,
                                marks[12].y < marks[10].y,
                                marks[16].y < marks[14].y,
                                marks[20].y < marks[18].y
                            ];
                            const thumb = Math.hypot(marks[4].x - marks[17].x, marks[4].y - marks[17].y) > 0.1;
                            const count = f.filter(v => v).length;

                            const wrist = marks[0];
                            let openDist = 0;
                            [8, 12, 16, 20].forEach(idx => {
                                openDist += Math.hypot(marks[idx].x - wrist.x, marks[idx].y - wrist.y);
                            });
                            const avgOpen = openDist / 4;
                            const wristToPinky = Math.hypot(marks[20].x - wrist.x, marks[20].y - wrist.y);
                            const dynamicThreshold = Math.max(0.12, wristToPinky * 0.35);
                            isFist = (avgOpen < dynamicThreshold);

                            if (thumb && count === 4) newMode = 5;
                            else if (thumb && f[3] && !f[0]) newMode = 6;
                            else newMode = count;
                        }

                        if (currentMode !== 0 && newMode === 0) {
                            if (!isFist) { return; }
                        }
                        if (currentMode !== newMode) {
                            setModeImmediate(newMode);
                        }
                    } catch (err) { console.warn('Gesture error:', err); }
                });

                const video = document.createElement('video');
                const cameraUtils = new Camera(video, {
                    onFrame: async () => {
                        try {
                            await hands.send({ image: video });
                        } catch (e) {}
                    },
                    width: 640,
                    height: 480,
                    fps: CONFIG.CAMERA_FPS
                });

                cameraUtils.start().then(() => {
                    document.getElementById('camera-error').style.display = 'none';
                    showToast('✅ 摄像头已启动，可以使用手势', 2000);
                }).catch(err => {
                    console.warn('Camera error:', err);
                    document.getElementById('camera-error').style.display = 'block';
                    showToast('⚠️ 摄像头无法访问，请使用点击或黄色按钮选择部件', 3000);
                });
            }

            // ===== 请求媒体权限（音视频） =====
            let cameraReady = false;
            let cameraTimeoutHandle = null;

            function requestMediaPermissions() {
                // 请求权限（音频+视频）
                initAudio();
                navigator.mediaDevices.getUserMedia({ audio: true, video: true })
                    .then(stream => {
                        stream.getTracks().forEach(track => track.stop());
                        cameraReady = true;
                        micPermissionGranted = true;
                        showToast('✅ 摄像头和麦克风权限已获取', 2000);
                        startGestureOnly();
                        enableStartButton();
                    })
                    .catch(err => {
                        console.warn('Media permission error:', err);
                        showToast('⚠️ 摄像头或麦克风权限被拒绝，点击模式可用', 4000);
                        cameraReady = false;
                        // 即使被拒，仍尝试启动手势（可能失败，但不会阻塞）
                        startGestureOnly();
                        // 如果被拒，尝试仅音频权限
                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(stream => {
                                stream.getTracks().forEach(t => t.stop());
                                micPermissionGranted = true;
                                showToast('✅ 麦克风权限已获取（摄像头未授权）', 2000);
                            })
                            .catch(() => {
                                micPermissionGranted = false;
                                document.getElementById('speech-fallback').style.display = 'flex';
                                showToast('⚠️ 麦克风权限被拒绝，请使用输入框', 3000);
                            });
                        enableStartButton();
                    });

                if (cameraTimeoutHandle) clearTimeout(cameraTimeoutHandle);
                cameraTimeoutHandle = setTimeout(() => {
                    if (document.getElementById('btn-step2').disabled) {
                        enableStartButton();
                        showToast('⏳ 摄像头加载超时，您仍可使用点击模式', 3000);
                    }
                }, CONFIG.CAMERA_TIMEOUT);
            }

            function enableStartButton() {
                const btn = document.getElementById('btn-step2');
                btn.disabled = false;
                btn.textContent = '🚀 开始挑战';
                document.getElementById('camera-loading').classList.remove('show');
                if (cameraTimeoutHandle) {
                    clearTimeout(cameraTimeoutHandle);
                    cameraTimeoutHandle = null;
                }
            }

            // ===== 点击处理 =====
            function setupClickHandler() {
                const canvas = renderer.domElement;

                function getClickPoint(event) {
                    const rect = canvas.getBoundingClientRect();
                    let clientX, clientY;
                    if (event.touches) {
                        clientX = event.touches[0].clientX;
                        clientY = event.touches[0].clientY;
                        event.preventDefault();
                    } else {
                        clientX = event.clientX;
                        clientY = event.clientY;
                    }
                    const x = ((clientX - rect.left) / rect.width) * 2 - 1;
                    const y = -((clientY - rect.top) / rect.height) * 2 + 1;
                    return new THREE.Vector2(x, y);
                }

                function handleClick(event) {
                    if (clickCooldown) return;
                    clickCooldown = true;
                    setTimeout(() => { clickCooldown = false; }, 250);

                    if (!gameActive || isVictory || isGameFinished) return;
                    if (Object.keys(DATA).every(key => DATA[key].status.every(s => s === true))) return;

                    const mouse = getClickPoint(event);
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);

                    const planeNormal = new THREE.Vector3(0, 0, 1);
                    const plane = new THREE.Plane(planeNormal, 0);
                    const intersectPoint = new THREE.Vector3();
                    const ray = raycaster.ray;
                    const denom = ray.direction.dot(planeNormal);
                    if (Math.abs(denom) < 1e-6) return;
                    const t = -(ray.origin.dot(planeNormal) - plane.constant) / denom;
                    if (t < 0) return;
                    intersectPoint.copy(ray.origin).add(ray.direction.clone().multiplyScalar(t));

                    let hitId = -1;
                    let minDist = Infinity;
                    for (let i = 0; i < particleMeta.length; i++) {
                        const m = particleMeta[i];
                        if (m.unlockId < 1 || m.unlockId > 6) continue;
                        const dx = intersectPoint.x - m.ox;
                        const dy = intersectPoint.y - m.oy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDist) { minDist = dist;
                            hitId = m.unlockId; }
                    }

                    if (hitId !== -1 && minDist < CONFIG.CLICK_PARTICLE_RADIUS) {
                        if (hitId === currentMode) return;
                        setModeImmediate(hitId);
                    } else {
                        if (currentMode !== 0) setModeImmediate(0);
                    }
                }

                canvas.addEventListener('click', handleClick);
                canvas.addEventListener('touchstart', handleClick, { passive: false });
            }

            // ===== 模式切换 =====
            function setModeImmediate(newMode) {
                if (currentMode === newMode) return;
                currentMode = newMode;
                if (newMode === 0) {
                    morphFactor = 0;
                    selectFactor = 0;
                    document.getElementById('info-panel').classList.remove('active');
                } else {
                    morphFactor = 1;
                    selectFactor = 1;
                    if (rec && !recStarted) tryStartRecognition();
                    updateUI();
                }
                const yellowBtn = document.getElementById('btn-yellow');
                if (currentMode === 1) yellowBtn.classList.add('active-mode');
                else yellowBtn.classList.remove('active-mode');
            }

            // ===== 胜利 =====
            function triggerVictory() {
                if (victoryPlayed) return;
                victoryPlayed = true;
                isVictory = true;
                if (timerRAF) { cancelAnimationFrame(timerRAF);
                    timerRAF = null; }
                gameActive = false;
                playVictorySound();
                document.getElementById('victory-screen').classList.add('active');
                document.getElementById('victory-sub').textContent = '您已完全掌握辉煌条纹的含义！';
                if (!isGameFinished) {
                    const elapsed = CONFIG.GAME_DURATION - timeLeft;
                    const record = { name: playerName, school: playerSchool, status: 'completed', score: elapsed,
                        timestamp: Date.now() };
                    saveRecord(record);
                    document.getElementById('victory-score').textContent = `⏱️ ${elapsed} 秒`;
                }
                stopRecognition();
                if (recGuardInterval) { clearInterval(recGuardInterval);
                    recGuardInterval = null; }
                showToast('🎉 恭喜完成所有部件！');
            }

            // ===== UI 更新 =====
            function updateUI() {
                const panel = document.getElementById('info-panel');
                const descContainer = document.getElementById('info-desc');
                const config = DATA[currentMode];

                if (config && currentMode > 0) {
                    const titleEl = document.getElementById('info-title');
                    titleEl.innerText = config.name;
                    titleEl.style.color = config.uiHex;
                    titleEl.style.background = 'none';
                    titleEl.style.webkitBackgroundClip = 'unset';
                    titleEl.style.webkitTextFillColor = 'unset';

                    descContainer.innerHTML = "";
                    config.points.forEach((text, idx) => {
                        let html = text;
                        const kwCount = config.kws.length;
                        for (let i = 0; i < kwCount; i++) {
                            const isFound = config.status[i] || false;
                            const kw = config.kws[i] || '';
                            const style = isFound ? "kw-found" : "kw-locked";
                            const label = isFound ? kw : "( ? )";
                            html = html.replace(new RegExp(`\\{${i}\\}`, 'g'),
                                `<span class="${style}">${label}</span>`);
                        }
                        const item = document.createElement('div');
                        item.className = 'point-item';
                        item.style.borderLeftColor = config.uiHex;
                        item.innerHTML = html;
                        descContainer.appendChild(item);
                    });

                    if (currentMode === 6) panel.classList.add('layout-6');
                    else panel.classList.remove('layout-6');
                    panel.classList.add('active');
                } else {
                    panel.classList.remove('active');
                }
            }

            // ================================================================
            // ★★★ 修改：游戏启动时先请求麦克风权限 ★★★
            // ================================================================
            function startGame() {
                // 先确保麦克风权限
                ensureMicrophonePermission().then(() => {
                    // 权限处理完毕，继续
                    resetProgress();
                    currentMode = 0;
                    morphFactor = 0;
                    selectFactor = 0;
                    isVictory = false;
                    victoryPlayed = false;
                    allFinishedFlag = false;
                    isGameFinished = false;
                    gameActive = true;

                    document.getElementById('start-panel').classList.add('hidden');
                    document.getElementById('btn-yellow').style.display = 'flex';

                    if (!rec) {
                        rec = initSpeechRecognition();
                        if (rec) setupSpeechFallback();
                    }
                    if (rec) tryStartRecognition();
                    else document.getElementById('speech-fallback').style.display = 'flex';

                    startGuardian();

                    timeLeft = CONFIG.GAME_DURATION;
                    updateTimerDisplay();
                    document.getElementById('timer-display').classList.remove('idle');

                    gameStartTime = performance.now();

                    function updateTimer() {
                        if (!gameActive) return;
                        const elapsed = (performance.now() - gameStartTime) / 1000;
                        const remaining = Math.max(0, CONFIG.GAME_DURATION - elapsed);
                        timeLeft = Math.floor(remaining);
                        updateTimerDisplay();
                        if (remaining <= 0) {
                            document.getElementById('timer-display').textContent = '00:00';
                            handleGameTimeout();
                            return;
                        }
                        timerRAF = requestAnimationFrame(updateTimer);
                    }
                    timerRAF = requestAnimationFrame(updateTimer);

                    updateUI();
                    if (!isSpeechSupported) {
                        showToast('🔊 请输入关键词到下方输入框');
                    }
                });
            }

            function updateTimerDisplay() {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                const display = document.getElementById('timer-display');
                display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                if (timeLeft <= 30) display.classList.add('warning');
                else display.classList.remove('warning');
            }

            function handleGameTimeout() {
                if (isGameFinished) return;
                isGameFinished = true;
                gameActive = false;
                if (timerRAF) { cancelAnimationFrame(timerRAF);
                    timerRAF = null; }
                stopGuardian();
                const unlockedCount = Object.keys(DATA).filter(key => DATA[key].status.every(s => s === true)).length;
                const record = { name: playerName, school: playerSchool, status: 'timeout', score: unlockedCount,
                    timestamp: Date.now() };
                saveRecord(record);
                isVictory = true;
                document.getElementById('victory-sub').textContent = '⏰ 时间到！';
                document.getElementById('victory-score').textContent =
                    `📚 您已理解 ${unlockedCount}/${TOTAL_ITEMS} 个部分`;
                document.getElementById('victory-screen').classList.add('active');
                stopRecognition();
                showToast('⏰ 时间到！');
            }

            // ===== 排行榜 =====
            function renderLeaderboard() {
                const container = document.getElementById('leaderboard-list');
                const allData = getLeaderboardData();
                const pageSize = CONFIG.LB_PAGE_SIZE;
                const totalPages = Math.max(1, Math.ceil(allData.length / pageSize));
                if (lbCurrentPage > totalPages) lbCurrentPage = totalPages;
                if (lbCurrentPage < 1) lbCurrentPage = 1;
                const start = (lbCurrentPage - 1) * pageSize;
                const pageData = allData.slice(start, start + pageSize);

                if (allData.length === 0) {
                    container.innerHTML = '<div class="leaderboard-empty">暂无完成记录的玩家。</div>';
                } else {
                    let html = '';
                    pageData.forEach((r, idx) => {
                        const rank = start + idx + 1;
                        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}.`;
                        html += `<div class="lb-item">
                            <span class="rank">${medal}</span>
                            <span class="name">${escapeHtml(r.name)}</span>
                            <span class="score">${r.score} 秒</span>
                        </div>`;
                    });
                    container.innerHTML = html;
                }
                document.getElementById('lb-page-info').textContent = `${lbCurrentPage} / ${totalPages}`;
                document.getElementById('lb-prev').disabled = (lbCurrentPage <= 1);
                document.getElementById('lb-next').disabled = (lbCurrentPage >= totalPages);
            }

            function renderRecords(tab = recordsCurrentTab) {
                recordsCurrentTab = tab;
                const records = getRecords();
                let filtered = [];
                if (tab === 'all') filtered = records;
                else if (tab === 'completed') filtered = records.filter(r => r.status === 'completed');
                else if (tab === 'timeout') filtered = records.filter(r => r.status === 'timeout');
                filtered.sort((a, b) => b.timestamp - a.timestamp);

                const pageSize = CONFIG.RECORDS_PAGE_SIZE;
                const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
                if (recordsCurrentPage > totalPages) recordsCurrentPage = totalPages;
                if (recordsCurrentPage < 1) recordsCurrentPage = 1;
                const start = (recordsCurrentPage - 1) * pageSize;
                const pageData = filtered.slice(start, start + pageSize);

                const container = document.getElementById('records-list');
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="records-empty">暂无记录。</div>';
                } else {
                    let html = `<table class="records-table">
                        <thead><tr><th>#</th><th>姓名</th><th>学校</th><th>状态</th><th>成绩</th><th>日期</th></tr></thead><tbody>`;
                    pageData.forEach((r, idx) => {
                        const realIdx = start + idx + 1;
                        const statusText = r.status === 'completed' ? '已完成' : '超时';
                        const badgeClass = r.status === 'completed' ? 'badge-completed' : 'badge-timeout';
                        const scoreDisplay = r.status === 'completed' ? `${r.score} 秒` :
                            `${r.score}/${TOTAL_ITEMS} 个部分`;
                        const dateStr = new Date(r.timestamp).toLocaleString('zh-CN', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        html += `<tr>
                            <td>${realIdx}</td>
                            <td>${escapeHtml(r.name)}</td>
                            <td>${escapeHtml(r.school)}</td>
                            <td><span class="badge ${badgeClass}">${statusText}</span></td>
                            <td>${scoreDisplay}</td>
                            <td>${dateStr}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                    container.innerHTML = html;
                }
                document.getElementById('records-page-info').textContent = `${recordsCurrentPage} / ${totalPages}`;
                document.getElementById('records-prev').disabled = (recordsCurrentPage <= 1);
                document.getElementById('records-next').disabled = (recordsCurrentPage >= totalPages);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function exportExcel() {
                const records = getRecords();
                if (records.length === 0) { showToast('没有可导出的记录'); return; }
                try {
                    const data = records.map(r => ({
                        '姓名': r.name,
                        '学校': r.school,
                        '状态': r.status === 'completed' ? '已完成' : '超时',
                        '成绩': r.status === 'completed' ? `${r.score} 秒` : `${r.score}/${TOTAL_ITEMS} 个部分`,
                        '日期': new Date(r.timestamp).toLocaleString('zh-CN', { day: '2-digit', month: '2-digit',
                            year: 'numeric', hour: '2-digit', minute: '2-digit' })
                    }));
                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.json_to_sheet(data);
                    XLSX.utils.book_append_sheet(wb, ws, '记录');
                    XLSX.writeFile(wb, `Jalur_记录_${new Date().toISOString().slice(0,10)}.xlsx`);
                    showToast('✅ 导出成功');
                } catch (e) { showToast('⚠️ 导出失败: ' + e.message); }
            }

            // ===== 黄色按钮 =====
            function setupYellowButton() {
                const btn = document.getElementById('btn-yellow');
                btn.addEventListener('click', () => {
                    initAudio();
                    if (currentMode === 1) setModeImmediate(0);
                    else setModeImmediate(1);
                });
            }

            // ===== 动画 =====
            function animate() {
                requestAnimationFrame(animate);
                if (!particles) return;

                const targetMorph = (currentMode !== 0) ? 1 : 0;
                const targetSelect = (currentMode !== 0) ? 1 : 0;
                morphFactor += (targetMorph - morphFactor) * 0.2;
                selectFactor += (targetSelect - selectFactor) * 0.2;

                const posAttr = particles.geometry.attributes.position;
                const colAttr = particles.geometry.attributes.color;

                for (let i = 0; i < particleMeta.length; i++) {
                    const m = particleMeta[i];
                    let tx = m.ox,
                        ty = m.oy,
                        tz = 0,
                        br = 1.0;

                    if (currentMode >= 1 && currentMode <= 5) {
                        const isMatch = (m.type === currentMode || (currentMode === 1 && (m.type === 5 || m.type === 7)));
                        if (isMatch) {
                            tx = m.ox * 0.8;
                            ty = m.oy * 0.8 + 80;
                            tz = 180;
                        } else {
                            tz = -600;
                            br = 0.1;
                        }
                    } else if (currentMode === 6) {
                        if (m.type === 3 || m.type === 4) {
                            tx = m.ox * 0.5 - 320;
                            ty = m.oy * 0.5 - 180;
                        } else if (m.type === 7) {
                            tx = m.ox * 1.2 - 120;
                            ty = m.oy * 1.2 + 40;
                            tz = 100;
                        } else {
                            tz = -600;
                            br = 0.1;
                        }
                    }

                    let isLit = false;
                    if (currentMode === 0) {
                        isLit = UNLOCKED_STAGES[m.unlockId] || (UNLOCKED_STAGES[1] && (m.unlockId === 5 || m.unlockId === 6));
                    } else if (currentMode === 1) {
                        isLit = UNLOCKED_STAGES[1];
                    } else {
                        isLit = DATA[currentMode] && DATA[currentMode].status.every(s => s);
                    }

                    let r, g, b;
                    if (isLit) {
                        r = m.r;
                        g = m.g;
                        b = m.b;
                    } else {
                        const gray = (m.r + m.g + m.b) / 3 * 0.25;
                        r = g = b = gray;
                    }

                    const cX = posAttr.getX(i),
                        cY = posAttr.getY(i),
                        cZ = posAttr.getZ(i);
                    posAttr.setXYZ(i, cX + (tx - cX) * 0.15, cY + (ty - cY) * 0.15, cZ + (tz - cZ) * 0.15);
                    colAttr.setXYZ(i, r * br, g * br, b * br);
                }
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                renderer.render(scene, camera);
            }

            // ===== 窗口自适应 =====
            window.addEventListener('resize', () => {
                if (camera) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            function toggleFullScreen() {
                const el = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
            window.toggleFullScreen = toggleFullScreen;

            // ===== 清理 =====
            function cleanupGame() {
                if (timerRAF) { cancelAnimationFrame(timerRAF);
                    timerRAF = null; }
                if (recGuardInterval) { clearInterval(recGuardInterval);
                    recGuardInterval = null; }
                if (saveProgressTimer) { clearTimeout(saveProgressTimer);
                    saveProgressTimer = null; }
                if (rec) { try { rec.stop(); } catch (e) {}
                    rec = null;
                    recStarted = false; }
                if (renderer) { renderer.dispose(); }
                gameActive = false;
            }
            window.addEventListener('beforeunload', cleanupGame);

            // ===== 启动 =====
            async function boot() {
                initScene();
                await loadFlag();
                animate();

                loadProgress();
                setupYellowButton();
                setupClickHandler();

                const step1Btn = document.getElementById('btn-step1');
                const nameInput = document.getElementById('player-name');
                const schoolInput = document.getElementById('player-school');
                const step2Btn = document.getElementById('btn-step2');

                function handleStep1() {
                    const name = nameInput.value.trim();
                    const school = schoolInput.value.trim();
                    if (!name || !school) {
                        showToast('请输入您的姓名和学校');
                        return;
                    }
                    playerName = name;
                    playerSchool = school;

                    document.getElementById('step1-card').style.display = 'none';
                    document.getElementById('step2-card').style.display = 'block';
                    document.getElementById('camera-loading').classList.add('show');
                    step2Btn.disabled = true;
                    step2Btn.textContent = '⏳ 摄像头准备中...';

                    // 请求权限（音视频）
                    requestMediaPermissions();
                    initAudio();
                }

                step1Btn.addEventListener('click', handleStep1);
                nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleStep1(); });
                schoolInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleStep1(); });

                step2Btn.addEventListener('click', () => {
                    startGame();
                });

                // 关闭面板
                document.getElementById('close-panel').addEventListener('click', () => {
                    document.getElementById('info-panel').classList.remove('active');
                    if (currentMode !== 0) setModeImmediate(0);
                });

                // 排行榜
                document.getElementById('btn-leaderboard').addEventListener('click', () => {
                    lbCurrentPage = 1;
                    renderLeaderboard();
                    document.getElementById('leaderboard-panel').classList.add('active');
                });
                document.getElementById('btn-close-lb').addEventListener('click', () => {
                    document.getElementById('leaderboard-panel').classList.remove('active');
                });
                document.getElementById('leaderboard-panel').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) document.getElementById('leaderboard-panel').classList.remove(
                        'active');
                });
                document.getElementById('lb-prev').addEventListener('click', () => {
                    if (lbCurrentPage > 1) { lbCurrentPage--;
                        renderLeaderboard(); }
                });
                document.getElementById('lb-next').addEventListener('click', () => {
                    const total = Math.ceil(getLeaderboardData().length / CONFIG.LB_PAGE_SIZE);
                    if (lbCurrentPage < total) { lbCurrentPage++;
                        renderLeaderboard(); }
                });

                // 记录
                document.getElementById('status-title-double').addEventListener('dblclick', () => {
                    recordsCurrentPage = 1;
                    renderRecords(recordsCurrentTab);
                    document.getElementById('records-panel').classList.add('active');
                });

                document.querySelectorAll('.records-tabs button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.records-tabs button').forEach(b => b.classList.remove(
                            'active'));
                        btn.classList.add('active');
                        recordsCurrentPage = 1;
                        renderRecords(btn.dataset.tab);
                    });
                });

                document.getElementById('btn-close-records').addEventListener('click', () => {
                    document.getElementById('records-panel').classList.remove('active');
                });
                document.getElementById('records-panel').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) document.getElementById('records-panel').classList.remove(
                        'active');
                });
                document.getElementById('records-prev').addEventListener('click', () => {
                    if (recordsCurrentPage > 1) { recordsCurrentPage--;
                        renderRecords(recordsCurrentTab); }
                });
                document.getElementById('records-next').addEventListener('click', () => {
                    const records = getRecords();
                    let filtered = [];
                    if (recordsCurrentTab === 'all') filtered = records;
                    else if (recordsCurrentTab === 'completed') filtered = records.filter(r => r.status === 'completed');
                    else if (recordsCurrentTab === 'timeout') filtered = records.filter(r => r.status === 'timeout');
                    const total = Math.ceil(filtered.length / CONFIG.RECORDS_PAGE_SIZE);
                    if (recordsCurrentPage < total) { recordsCurrentPage++;
                        renderRecords(recordsCurrentTab); }
                });

                document.getElementById('btn-export-excel').addEventListener('click', exportExcel);

                document.getElementById('btn-replay-ui').addEventListener('click', () => {
                    playDing();
                    cleanupGame();
                    setTimeout(() => location.reload(), 300);
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'f' || e.key === 'F') toggleFullScreen();
                });

                if (!isSpeechSupported) {
                    showToast('🔊 语音识别不可用，请使用下方输入框', 5000);
                }
            }

            window.onload = boot;
        })();
    </script>
</body>
