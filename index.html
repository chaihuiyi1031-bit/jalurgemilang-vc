<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>辉煌条纹 - 思维激荡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 蓝金铭牌风格 ===== */
        :root {
            --void: #050508;
            --void-2: #0b0c14;
            --panel: #101018;
            --panel-2: #14141f;
            --gold: #ffcc00;
            --gold-bright: #ffd700;
            --gold-dim: #b8960a;
            --gold-line: rgba(255, 204, 0, 0.4);
            --blue: #003366;
            --blue-bright: #1a4f8a;
            --blue-line: rgba(0, 51, 102, 0.5);
            --maroon: #7d2836;
            --maroon-bright: #e0576e;
            --teal: #1c8a7c;
            --ivory: #f6efdc;
            --ink: #d8cfba;
            --ink-dim: #7d7461;
            --font-display: 'Fraunces', 'Georgia', serif;
            --font-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--void);
            font-family: var(--font-body);
            color: var(--ivory);
            touch-action: none;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 900px 600px at 15% -5%, rgba(255, 204, 0, 0.12), transparent 60%),
                radial-gradient(ellipse 700px 700px at 105% 105%, rgba(0, 51, 102, 0.18), transparent 60%),
                radial-gradient(ellipse 1400px 900px at 50% 50%, rgba(255, 204, 0, 0.03), transparent 70%);
            animation: ambientBreathe 12s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
            background-image: radial-gradient(rgba(255,255,255,0.045) 0.6px, transparent 0.6px);
            background-size: 3px 3px;
            mix-blend-mode: overlay;
        }
        @keyframes ambientBreathe {
            0% { opacity: 0.75; }
            100% { opacity: 1; }
        }

        /* ===== 状态栏 ===== */
        #status-bar {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 1000;
            background: linear-gradient(155deg, var(--panel-2), var(--panel) 80%);
            border: 1px solid var(--blue-line);
            border-radius: 16px;
            padding: 18px 24px 16px;
            min-width: 236px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .status-title {
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(120deg, var(--ivory), var(--gold-bright) 65%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: default;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-title .progress-text {
            font-size: 14px;
            opacity: 0.7;
            font-family: var(--font-mono);
            color: var(--gold-bright);
            -webkit-text-fill-color: var(--gold-bright);
            background: none;
        }
        .status-title.dbl-click-hint { cursor: pointer; }
        .status-title.dbl-click-hint::after { content: '⏎'; font-size: 10px; color: #555; margin-left: 4px; opacity: 0.3; }

        .status-timer {
            position: relative;
            font-family: var(--font-mono);
            font-size: 19px;
            font-weight: 700;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
            color: var(--ivory);
            letter-spacing: 0.5px;
            background:
                radial-gradient(circle at 35% 28%, #1a2a3f, #08080c 72%);
            box-shadow:
                inset 0 0 0 2px rgba(255, 204, 0, 0.55),
                inset 0 0 14px rgba(0,0,0,0.6),
                0 0 0 5px rgba(255, 204, 0, 0.06);
        }
        .status-timer::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background-image: repeating-conic-gradient(
                var(--gold) 0deg 2.5deg,
                transparent 2.5deg 9deg
            );
            -webkit-mask-image: radial-gradient(circle, transparent 41px, #000 42px, #000 45px, transparent 46px);
            mask-image: radial-gradient(circle, transparent 41px, #000 42px, #000 45px, transparent 46px);
            opacity: 0.75;
            animation: dialSpin 40s linear infinite;
        }
        @keyframes dialSpin { to { transform: rotate(360deg); } }
        .status-timer.warning {
            color: var(--maroon-bright);
            animation: pulse 0.6s infinite alternate;
        }
        .status-timer.warning::before {
            background-image: repeating-conic-gradient(
                var(--maroon-bright) 0deg 2.5deg,
                transparent 2.5deg 9deg
            );
        }
        .status-timer.idle { opacity: 0.4; }
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.04); }
        }
        .status-hint {
            font-size: 11.5px;
            color: var(--ink-dim);
            letter-spacing: 0.3px;
        }
        .status-hint span {
            display: inline-block;
            margin-right: 10px;
        }
        .status-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #btn-leaderboard {
            background: none;
            border: 1px solid transparent;
            color: var(--gold-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 3px 7px;
            border-radius: 6px;
            transition: 0.2s;
            opacity: 0.8;
            line-height: 1;
        }
        #btn-leaderboard:hover {
            background: rgba(255, 204, 0, 0.1);
            border-color: var(--gold-line);
            color: var(--gold-bright);
            opacity: 1;
            transform: scale(1.1);
        }
        #mic-status {
            display: inline-block !important;
            font-size: 18px;
            line-height: 1;
            transition: color 0.3s;
        }
        #mic-status.active { color: #ffcc00; animation: micPulse 1.5s infinite; }
        #mic-status.inactive { color: #555; animation: none; opacity: 0.5; }
        @keyframes micPulse { 0%{opacity:0.7;}50%{opacity:1;}100%{opacity:0.7;} }
        #camera-error {
            font-size: 11px;
            color: #ff6b6b;
            margin-top: 4px;
            display: none;
            text-align: left;
        }

        /* ===== 黄色专用按钮（左下方） ===== */
        #btn-yellow {
            position: absolute;
            bottom: 120px;
            left: 24px;
            z-index: 999;
            background: linear-gradient(135deg, #ffcc00, #e6b800);
            border: 2px solid #b8960a;
            border-radius: 60px;
            color: #1a1500;
            font-size: 16px;
            font-weight: 800;
            padding: 14px 28px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 204, 0, 0.35);
            transition: all 0.25s ease;
            touch-action: manipulation;
            letter-spacing: 0.5px;
            font-family: var(--font-display);
            display: none;
            align-items: center;
            gap: 10px;
        }
        #btn-yellow::before { content: '🟡'; font-size: 22px; }
        #btn-yellow:hover { transform: scale(1.06); box-shadow: 0 12px 40px rgba(255,204,0,0.6); }
        #btn-yellow:active { transform: scale(0.95); }
        #btn-yellow.active-mode { border-color: #fff; box-shadow: 0 0 30px rgba(255,204,0,0.8),0 0 60px rgba(255,204,0,0.3); }

        /* ===== 开始面板 ===== */
        #start-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5000;
            background: rgba(2, 2, 5, 0.78);
            backdrop-filter: blur(22px) saturate(1.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        #start-panel.hidden { opacity: 0; pointer-events: none; }
        .start-card {
            background: linear-gradient(165deg, var(--panel-2), #08080d 88%);
            border: 1px solid var(--blue-line);
            border-radius: 28px;
            padding: 56px 44px 40px;
            max-width: 560px;
            width: 92%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 204, 0, 0.06) inset;
            text-align: center;
            position: relative;
            transition: opacity 0.4s, transform 0.4s;
        }
        .start-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% -8%, rgba(255, 204, 0, 0.14), transparent 55%);
            pointer-events: none;
            border-radius: 28px;
        }
        .start-card .icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 108px;
            height: 108px;
            margin: 0 auto 18px;
            font-size: 46px;
            filter: drop-shadow(0 0 16px rgba(255, 204, 0, 0.4));
        }
        .start-card .icon::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid var(--gold-line);
            background: radial-gradient(circle at 40% 30%, rgba(255,204,0,0.14), rgba(0,0,0,0) 70%);
        }
        .start-card .icon::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background-image: repeating-conic-gradient(
                var(--gold) 0deg 3deg,
                transparent 3deg 12deg
            );
            -webkit-mask-image: radial-gradient(circle, transparent 52px, #000 53px, #000 56px, transparent 57px);
            mask-image: radial-gradient(circle, transparent 52px, #000 53px, #000 56px, transparent 57px);
            opacity: 0.7;
            animation: dialSpin 50s linear infinite;
        }
        .start-card h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: clamp(40px, 8vw, 50px);
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
            background: linear-gradient(180deg, var(--ivory) 20%, var(--gold-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }
        .start-card .sub {
            font-family: 'Times New Roman', Times, serif;
            color: var(--ink-dim);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            position: relative;
        }
        .start-card .sub::before,
        .start-card .sub::after {
            content: '◆';
            color: var(--gold-dim);
            font-size: 6px;
            margin: 0 10px;
            vertical-align: middle;
        }
        .start-card .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 26px;
            position: relative;
        }
        .start-card .input-group input {
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-bottom: 2px solid var(--gold-line);
            background: rgba(255, 255, 255, 0.025);
            color: var(--ivory);
            font-family: var(--font-body);
            font-size: 17px;
            outline: none;
            transition: 0.25s;
        }
        .start-card .input-group input:focus {
            border-color: var(--gold);
            background: rgba(255, 204, 0, 0.07);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.14);
        }
        .start-card .input-group input::placeholder { color: #625c4e; font-weight: 300; }
        .start-card .rules {
            background: rgba(255, 255, 255, 0.025);
            border-radius: 12px;
            padding: 18px 22px;
            margin: 6px 0 28px;
            text-align: left;
            font-size: 14px;
            line-height: 1.85;
            color: var(--ink);
            border-left: 2px solid var(--gold);
            position: relative;
        }
        .start-card .rules strong { color: var(--gold-bright); font-weight: 600; }
        .btn-start {
            position: relative;
            background: linear-gradient(120deg, var(--gold-bright), var(--gold) 55%, var(--gold-dim));
            border: none;
            color: #16110a;
            padding: 18px 48px;
            border-radius: 60px;
            font-family: var(--font-display);
            font-size: 21px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 1.5px;
            touch-action: manipulation;
            width: 100%;
            overflow: hidden;
        }
        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
            animation: sheen 3.2s ease-in-out infinite;
        }
        @keyframes sheen {
            0% { left: -60%; }
            45%, 100% { left: 130%; }
        }
        .btn-start:hover,
        .btn-start:active {
            transform: scale(1.02);
            box-shadow: 0 14px 40px rgba(255, 204, 0, 0.45);
        }
        .btn-start:disabled { opacity: 0.5; transform: none; box-shadow: none; cursor: not-allowed; }
        .start-card .footnote {
            font-size: 12px;
            color: var(--ink-dim);
            margin-top: 18px;
            letter-spacing: 0.3px;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 26px;
        }
        .step-dot {
            width: 26px;
            height: 5px;
            background: #232330;
            transition: 0.3s;
            border-radius: 4px;
        }
        .step-dot.active {
            background: linear-gradient(90deg, var(--gold), var(--gold-bright));
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }
        .step-dot.done { background: var(--gold-dim); }

        /* ===== 信息面板 ===== */
        #info-panel {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 88%;
            max-width: 820px;
            background: linear-gradient(160deg, var(--panel-2), var(--panel));
            border: 2px solid #ffcc00;
            border-radius: 24px;
            padding: 32px 36px 28px;
            text-align: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.8);
            z-index: 1500;
        }
        #info-panel.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #info-panel.layout-6 {
            left: 72%;
            width: 35%;
            max-width: 500px;
            bottom: 50%;
            transform: translate(-50%, 50%);
            text-align: left;
            align-items: flex-start;
        }
        #info-panel.layout-6.active {
            transform: translate(-50%, 50%);
        }
        #info-title {
            margin: 4px 0 14px 0;
            font-family: var(--font-display);
            font-size: clamp(24px, 4.2vw, 38px);
            font-weight: 700;
        }
        #info-desc {
            font-size: clamp(17px, 2.6vw, 24px);
            line-height: 1.75;
            color: #fff;
            font-weight: 400;
        }
        .kw-locked {
            color: #555;
            text-decoration: underline dotted rgba(125, 116, 97, 0.6);
        }
        .kw-found {
            color: #ffcc00;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        .desc-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
        }
        #info-panel.layout-6 .desc-container {
            flex-direction: column;
        }
        .point-item {
            flex: 1;
            min-width: 200px;
            font-size: clamp(17px, 2.4vw, 22px);
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.03);
            padding: 16px 20px;
            border-radius: 12px;
            border-left: 4px solid transparent;
            color: #fff;
        }
        #close-panel {
            position: absolute;
            top: 16px;
            right: 24px;
            background: none;
            border: none;
            color: var(--ink-dim);
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            padding: 0 6px;
            touch-action: manipulation;
        }
        #close-panel:hover {
            color: var(--gold-bright);
            transform: rotate(90deg);
        }

        /* ===== 排行榜面板 ===== */
        #leaderboard-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(18px);
            z-index: 7000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #leaderboard-panel.active { display: flex; }
        .leaderboard-card {
            background: linear-gradient(165deg, var(--panel-2), #0a0a10);
            border: 1px solid var(--gold-line);
            border-radius: 28px;
            padding: 32px 36px;
            max-width: 540px;
            width: 100%;
            max-height: 80vh;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
        }
        .leaderboard-card h2 {
            color: var(--gold-bright);
            font-family: var(--font-display);
            font-size: 28px;
            margin: 0 0 16px 0;
            text-align: center;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 204, 0, 0.2);
            padding-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .leaderboard-card .lb-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .leaderboard-card .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 16px;
        }
        .leaderboard-card .lb-item .rank {
            color: var(--ink-dim);
            font-weight: 500;
            min-width: 40px;
        }
        .leaderboard-card .lb-item .name {
            color: var(--ivory);
            flex: 1;
            margin-left: 8px;
        }
        .leaderboard-card .lb-item .score {
            color: var(--gold-bright);
            font-weight: 600;
            min-width: 70px;
            text-align: right;
        }
        .leaderboard-empty {
            text-align: center;
            color: var(--ink-dim);
            padding: 40px 0;
            font-size: 18px;
            font-family: var(--font-display);
        }
        .lb-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .lb-pagination button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--ink);
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .lb-pagination button:hover:not(:disabled) {
            background: rgba(255, 204, 0, 0.15);
            border-color: var(--gold-line);
            color: var(--gold-bright);
        }
        .lb-pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .lb-pagination span { color: var(--ink-dim); font-size: 14px; }
        .btn-close-lb {
            display: block;
            margin: 16px auto 0;
            background: rgba(255,255,255,0.04);
            color: var(--ink);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 10px 32px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .btn-close-lb:hover {
            background: rgba(255, 204, 0, 0.12);
            border-color: var(--gold-line);
            color: var(--gold-bright);
        }

        /* ===== 胜利画面 ===== */
        #victory-screen {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            background: linear-gradient(160deg, #0a1420, #05080c 85%);
            border: 2px solid #ffcc00;
            border-radius: 40px;
            padding: 64px 56px 44px;
            text-align: center;
            box-shadow: 0 40px 130px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 204, 0, 0.1);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            max-width: 90vw;
        }
        #victory-screen.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        #victory-screen .trophy {
            font-size: 46px;
            margin-top: -32px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 24px rgba(255, 204, 0, 0.6));
        }
        #victory-screen h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(38px, 7vw, 62px);
            font-weight: 800;
            background: linear-gradient(to bottom, var(--ivory) 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }
        #victory-screen .sub {
            font-size: clamp(15px, 2vw, 20px);
            color: var(--ink);
            margin: 12px 0 24px;
            font-family: var(--font-body);
        }
        .victory-score {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 22px;
            color: var(--gold-bright);
            margin-bottom: 30px;
            font-weight: 700;
            padding: 10px 22px;
            border: 1px solid var(--gold-line);

    <script>
        (function() {

            const SUPABASE_URL = 'https://oiorljdmbjwcvepznpxj.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pb3JsamRtYmp3Y3ZlcHpucHhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzYxNjMsImV4cCI6MjEwMDgxMjE2M30.R-g6GzheuQlqR-SXwAFPU-cm4l1MqOEqGJIYRFgW1Ro';

            // ================================================================

                    points: ["象征 {0} 和 {1} 的团结。"], uiHex: "#ffcc00" }

            const TOTAL_ITEMS = Object.keys(DATA).length;
            const UNLOCKED_STAGES = {};

            // ================================================================

            let audioCtx = null;
            const APPLAUSE_URL = "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3";

            function initAudio() {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }

            function playDing() {
                try {
                    const ctx = initAudio();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {}
            }

            function playErrorSound() {
                try {
                    const ctx = initAudio();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {}
            }

            function playVictorySound() {
                try {
                    const ctx = initAudio();
                    [100, 400, 200, 600].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.1);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.15);
                        osc.stop(ctx.currentTime + i * 0.15 + 0.1);
                    });
                    const audio = new Audio(APPLAUSE_URL);
                    audio.volume = 0.6;
                    audio.play().catch(() => {});
                } catch (e) {}
            }

            // ================================================================
            // 4. Supabase 记录管理
            // ================================================================
            // 保存完成者记录
            async function saveCompletedRecord(name, school, timeSeconds) {
                const { error } = await supabase
                    .from('completed_players')
                    .insert([{ name, school, time_seconds: timeSeconds }]);
                if (error) console.error('❌ 保存完成记录失败:', error);
                else console.log('✅ 完成记录已存入 Supabase');
            }

            // 保存超时者记录
            async function saveTimeoutRecord(name, school, missedItems) {
                const { error } = await supabase
                    .from('timeout_players')
                    .insert([{ name, school, missed_items: missedItems }]);
                if (error) console.error('❌ 保存超时记录失败:', error);
                else console.log('✅ 超时记录已存入 Supabase');
            }

            // 获取排行榜数据（仅完成者）
            async function getLeaderboardData() {
                const { data, error } = await supabase
                    .from('completed_players')
                    .select('name, school, time_seconds')
                    .order('time_seconds', { ascending: true })
                    .limit(100);
                if (error) {
                    console.error('❌ 读取排行榜失败:', error);
                    return [];
                }
                return data.map(r => ({
                    name: r.name,
                    school: r.school,
                    score: r.time_seconds
                }));
            }

            // ================================================================
            // 5. 语音匹配 (中文 + 变体)
            // ================================================================
            function levenshtein(a, b) {
                const matrix = Array.from({ length: a.length + 1 }, (_, i) => i);
                for (let j = 1; j <= b.length; j++) {
                    let prev = matrix[0];
                    matrix[0] = j;
                    for (let i = 1; i <= a.length; i++) {
                        const temp = matrix[i];
                        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                        matrix[i] = Math.min(
                            matrix[i - 1] + 1,
                            matrix[0] + 1,
                            prev + cost
                        );
                        prev = temp;
                    }
                }
                return matrix[a.length];
            }

            function getThreshold(wordLen) {
                if (wordLen <= 2) return 0;
                if (wordLen <= 4) return 1;
                if (wordLen <= 6) return 2;
                return 3;
            }

            const VARIANT_MAP = {
                "忠于君国": ["忠于君国", "忠于君", "忠君国", "忠于君王", "忠于国家", "忠君", "忠国", "君国", "忠于"],
                "团结一致": ["团结一致", "团结"],
                "勇敢": ["勇敢", "勇敢的", "勇", "敢"],
                "纯洁": ["纯洁", "纯"],
                "真诚": ["真诚", "真"],
                "伊斯兰教": ["伊斯兰教", "伊斯兰"],
                "13个州": ["13个州", "十三个州", "13州"],
                "联邦直辖区": ["联邦直辖区", "联邦辖区", "直辖区"]
            };

            function isKeywordMatch(kw, speech) {
                const clean = s => s.replace(/[^a-z0-9\u4e00-\u9fa5]/g, '').toLowerCase();
                const cleanKw = clean(kw);
                const cleanSpeech = clean(speech);

                // 优先：直接包含变体
                const variants = VARIANT_MAP[kw] || [kw];
                for (let v of variants) {
                    if (speech.includes(v)) return true;
                    if (cleanSpeech.includes(clean(v))) return true;
                }

                // 备选：分词编辑距离
                const kwWords = cleanKw.split(/\s+/);
                const speechWords = cleanSpeech.split(/\s+/);
                if (kwWords.length === 0 || speechWords.length < kwWords.length) return false;

                const used = new Array(speechWords.length).fill(false);
                let allMatched = true;
                for (let kwWord of kwWords) {
                    let found = false;
                    for (let i = 0; i < speechWords.length; i++) {
                        if (used[i]) continue;
                        const dist = levenshtein(kwWord, speechWords[i]);
                        const threshold = getThreshold(kwWord.length);
                        if (dist <= threshold) {
                            used[i] = true;
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        allMatched = false;
                        break;
                    }
                }
                return allMatched;
            }

            // ================================================================
            // 6. 游戏状态
            // ================================================================
            let gameActive = false;
            let timerInterval = null;
            let timeLeft = CONFIG.GAME_DURATION;
            let playerName = '';
            let playerSchool = '';
            let isGameFinished = false;
            let isVictory = false;
            let isCamStarted = false;
            let recGuardInterval = null;
            let keepAliveInterval = null;
            let victoryPlayed = false;
            let allFinishedFlag = false;
            let clickLock = false;

            let scene, camera, renderer, particles, particleMeta = [];
            let currentMode = 0;
            const FLAG_URL =
                "https://2.bp.blogspot.com/-eebZvbZ1IVc/VAaQ9l_EpMI/AAAAAAAAKD8/rcoJeurNglc/s1600/Bendera%2BMalaysia%2B-%2BJalur%2BGemilang.png";

            let rec = null;
            let recStarted = false;
            let clickCooldown = false;
            let morphFactor = 0;
            let selectFactor = 0;

            let lbCurrentPage = 1;

            // ================================================================
            // 7. 语音识别 (增强稳定性)
            // ================================================================
            function initSpeechRecognition() {
                if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                    console.warn('Speech not supported');
                    updateMicStatus(false);
                    return null;
                }
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const r = new Recognition();
                r.lang = 'zh-CN';
                r.continuous = true;
                r.interimResults = false;

                r.onresult = (e) => {
                    if (!gameActive || currentMode === 0) return;
                    const lastIndex = e.results.length - 1;
                    let speech = e.results[lastIndex][0].transcript.toLowerCase().trim();
                    speech = speech.replace(/[，。、！？\s]+/g, ' ').trim();

                    // ★★★ 红色特殊处理（确保“勇敢”一定被计入） ★★★
                    if (currentMode === 3) {
                        if (speech.includes('勇敢') || speech.includes('勇')) {
                            const data = DATA[3];
                            if (!data.status[0]) {
                                data.status[0] = true;
                                playDing();
                                UNLOCKED_STAGES[3] = true;
                                updateUI();
                                forceUpdateParticles();
                                updateProgressDisplay();
                                console.log('✅ 红色已解锁 (勇敢)');
                                checkAllUnlockedAndFinish();
                                return;
                            }
                        }
                    }

                    // 通用匹配
                    const data = DATA[currentMode];
                    if (!data) return;
                    let matchedSomething = false;
                    data.kws.forEach((kw, idx) => {
                        if (data.status[idx]) return;
                        if (isKeywordMatch(kw, speech)) {
                            matchedSomething = true;
                            if (!data.status[idx]) {
                                data.status[idx] = true;
                                playDing();
                                UNLOCKED_STAGES[currentMode] = data.status.every(s => s === true);
                                updateUI();
                                forceUpdateParticles();
                                updateProgressDisplay();
                                console.log(`✅ ${data.name} 已解锁 (${kw})`);
                                checkAllUnlockedAndFinish();
                            }
                        }
                    });
                    if (!matchedSomething) playErrorSound();
                };

                r.onerror = (err) => {
                    console.warn('Speech error:', err);
                    if (err.error !== 'not-allowed' && gameActive && !isGameFinished) {
                        recStarted = false;
                        updateMicStatus(false);
                        tryStartRecognition();
                    } else {
                        updateMicStatus(false);
                    }
                };
                r.onend = () => {
                    if (gameActive && !isGameFinished && rec) {
                        recStarted = false;
                        updateMicStatus(false);
                        tryStartRecognition();
                    } else {
                        updateMicStatus(false);
                    }
                };
                return r;
            }

            function tryStartRecognition() {
                if (!rec || recStarted || !gameActive || isGameFinished) return;
                try {
                    initAudio();
                    rec.start();
                    recStarted = true;
                    updateMicStatus(true);
                } catch (e) {
                    recStarted = false;
                    updateMicStatus(false);
                    setTimeout(() => {
                        if (!recStarted && rec && gameActive && !isGameFinished) tryStartRecognition();
                    }, 300);
                }
            }

            function startRecognition() {
                if (rec && !recStarted) tryStartRecognition();
                else updateMicStatus(false);
            }

            function stopRecognition() {
                if (rec) {
                    try { rec.stop(); } catch (e) {}
                    recStarted = false;
                    updateMicStatus(false);
                }
            }

            function startGuardian() {
                if (recGuardInterval) clearInterval(recGuardInterval);
                recGuardInterval = setInterval(() => {
                    if (gameActive && !isGameFinished && rec && !recStarted) tryStartRecognition();
                }, CONFIG.REC_GUARD_INTERVAL);
                if (keepAliveInterval) clearInterval(keepAliveInterval);
                keepAliveInterval = setInterval(() => {
                    if (gameActive && !isGameFinished && rec && !recStarted) tryStartRecognition();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                    if (recStarted) updateMicStatus(true);
                }, CONFIG.KEEPALIVE_INTERVAL);
            }

            function stopGuardian() {
                if (recGuardInterval) { clearInterval(recGuardInterval);
                    recGuardInterval = null; }
                if (keepAliveInterval) { clearInterval(keepAliveInterval);
                    keepAliveInterval = null; }
            }

            function updateMicStatus(active) {
                const el = document.getElementById('mic-status');
                if (active) { el.className = 'active';
                    el.textContent = '🎤'; } else { el.className = 'inactive';
                    el.textContent = '🎤'; }
            }

            // ================================================================
            // 8. 进度管理

            function updateProgressDisplay() {
                let count = 0;
                for (let key in DATA) {
                    if (DATA[key].status.every(s => s === true)) count++;
                }

                if (el) el.textContent = `已完成: ${count}/${TOTAL_ITEMS}`;
                return count;
            }

            // ================================================================
            // 9. 胜利判定与触发
            // ================================================================
            function checkAllUnlockedAndFinish() {
                let allDone = true;
                for (let key in DATA) {
                    if (!DATA[key].status.every(s => s === true)) {
                        allDone = false;
                        break;
                    }
                }
                if (allDone) {
                    allFinishedFlag = true;
                    if (!victoryPlayed) {
                        console.log('🎉 所有部分已完成，触发胜利！');
                        triggerVictory();
                    }
                }
                return allDone;
            }

            function triggerVictory() {
                if (victoryPlayed) return;
                victoryPlayed = true;
                isVictory = true;
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                gameActive = false;
                playVictorySound();
                document.getElementById('victory-screen').classList.add('active');
                document.getElementById('victory-sub').textContent = '您已完全掌握辉煌条纹的含义！';
                if (!isGameFinished) {
                    const elapsed = CONFIG.GAME_DURATION - timeLeft;
                    // 存入 Supabase（完成者）
                    saveCompletedRecord(playerName, playerSchool, elapsed);
                    document.getElementById('victory-score').textContent = `⏱️ ${elapsed} 秒`;
                }
                stopRecognition();
                stopGuardian();
                clickLock = false;
                console.log('🎉 胜利画面已显示！');
            }

            // ================================================================
            // 10. Three.js 初始化
            // ================================================================
            function initScene() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
                camera.position.z = 900;
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.getElementById('container').appendChild(renderer.domElement);
            }

            function loadFlag() {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = FLAG_URL;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 512;
                        canvas.height = 256;
                        ctx.drawImage(img, 0, 0, 512, 256);
                        const imgData = ctx.getImageData(0, 0, 512, 256).data;
                        const pos = [],
                            col = [];
                        const step = CONFIG.PARTICLE_STEP;
                        for (let y = 0; y < 256; y += step) {
                            for (let x = 0; x < 512; x += step) {
                                const i = (Math.floor(y) * 512 + Math.floor(x)) * 4;
                                if (imgData[i + 3] > 128) {
                                    const vx = (x - 256) * 1.8;
                                    const vy = -(y - 128) * 1.8;
                                    pos.push(vx, vy, 0);
                                    const r = imgData[i] / 255,
                                        g = imgData[i + 1] / 255,
                                        b = imgData[i + 2] / 255;
                                    col.push(0.1, 0.1, 0.1);
                                    let gid = 0,
                                        unlockId = 0;
                                    if (r > 0.6 && g > 0.5 && b < 0.4) { gid = 1;
                                        unlockId = 1; } else if (b > 0.3 && b > r) { gid = 2;
                                        unlockId = 2; } else if (r > 0.6 && g < 0.4 && b < 0.4) { gid = 3;
                                        unlockId = 3; } else if (r > 0.8 && g > 0.8 && b > 0.8) { gid = 4;
                                        unlockId = 4; }
                                    if (gid === 1) {
                                        const dx = x - 166,
                                            dy = y - 64;
                                        if (dx * dx + dy * dy < 2800) { gid = 7;
                                            unlockId = 6; } else { gid = 5;
                                            unlockId = 5; }
                                    }
                                    particleMeta.push({
                                        ox: vx,
                                        oy: vy,
                                        type: gid,
                                        unlockId: unlockId,
                                        r: r,
                                        g: g,
                                        b: b,
                                        wx: vx,
                                        wy: vy
                                    });
                                }
                            }
                        }
                        const geo = new THREE.BufferGeometry();
                        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                        geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
                        particles = new THREE.Points(geo, new THREE.PointsMaterial({
                            size: 3,
                            vertexColors: true,
                            transparent: true,
                            blending: THREE.AdditiveBlending
                        }));
                        scene.add(particles);
                        resolve();
                    };
                    img.onerror = () => resolve();
                });
            }

            function forceUpdateParticles() {
                if (!particles) return;
                const colAttr = particles.geometry.attributes.color;
                for (let i = 0; i < particleMeta.length; i++) {
                    const m = particleMeta[i];
                    const isLit = UNLOCKED_STAGES[m.unlockId] || false;
                    let r, g, b;
                    if (isLit) {
                        r = m.r;
                        g = m.g;
                        b = m.b;
                    } else {
                        const gray = (m.r + m.g + m.b) / 3 * 0.25;
                        r = g = b = gray;
                    }
                    colAttr.setXYZ(i, r, g, b);
                }
                colAttr.needsUpdate = true;
            }

            // ================================================================
            // 11. 手势识别 + 点击锁定
            // ================================================================
            function startGestureOnly() {
                if (isCamStarted) return;
                isCamStarted = true;

                rec = initSpeechRecognition();

                const hands = new Hands({
                    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
                });
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((res) => {
                    try {
                        if (clickLock) return;
                        let newMode = 0;
                        let isFist = false;
                        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                            const marks = res.multiHandLandmarks[0];
                            const f = [
                                marks[8].y < marks[6].y,
                                marks[12].y < marks[10].y,
                                marks[16].y < marks[14].y,
                                marks[20].y < marks[18].y
                            ];
                            const thumb = Math.hypot(marks[4].x - marks[17].x, marks[4].y - marks[17].y) > 0.1;
                            const count = f.filter(v => v).length;
                            const wrist = marks[0];
                            let openDist = 0;
                            [8, 12, 16, 20].forEach(idx => {
                                openDist += Math.hypot(marks[idx].x - wrist.x, marks[idx].y - wrist.y);
                            });
                            const avgOpen = openDist / 4;
                            isFist = (avgOpen < CONFIG.FIST_THRESHOLD);
                            if (thumb && count === 4) newMode = 5;
                            else if (thumb && f[3] && !f[0]) newMode = 6;
                            else newMode = count;
                        }
                        if (currentMode !== 0 && newMode === 0) {
                            if (!isFist) return;
                        }
                        if (currentMode !== newMode) {
                            currentMode = newMode;
                            if (newMode > 0 && rec && !recStarted) tryStartRecognition();
                            updateUI();
                            forceUpdateParticles();
                        }
                    } catch (err) { console.warn('Gesture error:', err); }
                });

                const video = document.createElement('video');
                const cameraUtils = new Camera(video, {
                    onFrame: async () => { try { await hands.send({ image: video }); } catch (e) {} },
                    width: 640,
                    height: 480,
                    fps: CONFIG.CAMERA_FPS
                });
                cameraUtils.start().then(() => {
                    document.getElementById('camera-error').style.display = 'none';
                    enableStartButton();
                }).catch(err => {
                    console.warn('Camera error:', err);
                    document.getElementById('camera-error').style.display = 'block';
                    enableStartButton();
                });
            }

            function enableStartButton() {
                const btn = document.getElementById('btn-step2');
                btn.disabled = false;
                btn.textContent = '🚀 开始挑战';
            }

            // ================================================================
            // 12. 点击检测 (支持锁定)
            // ================================================================
            function setupClickHandler() {
                const canvas = renderer.domElement;

                function getClickPoint(event) {
                    const rect = canvas.getBoundingClientRect();
                    let clientX, clientY;
                    if (event.touches) {
                        clientX = event.touches[0].clientX;
                        clientY = event.touches[0].clientY;
                        event.preventDefault();
                    } else {
                        clientX = event.clientX;
                        clientY = event.clientY;
                    }
                    const x = ((clientX - rect.left) / rect.width) * 2 - 1;
                    const y = -((clientY - rect.top) / rect.height) * 2 + 1;
                    return new THREE.Vector2(x, y);
                }

                function handleClick(event) {
                    if (clickCooldown || !gameActive || isVictory || isGameFinished) return;
                    clickCooldown = true;
                    setTimeout(() => { clickCooldown = false; }, 250);

                    const mouse = getClickPoint(event);
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);
                    const planeNormal = new THREE.Vector3(0, 0, 1);
                    const plane = new THREE.Plane(planeNormal, 0);
                    const intersectPoint = new THREE.Vector3();
                    const ray = raycaster.ray;
                    const denom = ray.direction.dot(planeNormal);
                    if (Math.abs(denom) < 1e-6) return;
                    const t = -(ray.origin.dot(planeNormal) - plane.constant) / denom;
                    if (t < 0) return;
                    intersectPoint.copy(ray.origin).add(ray.direction.clone().multiplyScalar(t));

                    let hitId = -1,
                        minDist = Infinity;
                    for (let i = 0; i < particleMeta.length; i++) {
                        const m = particleMeta[i];
                        if (m.unlockId < 1 || m.unlockId > 6) continue;
                        const dx = intersectPoint.x - m.ox,
                            dy = intersectPoint.y - m.oy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDist) { minDist = dist;
                            hitId = m.unlockId; }
                    }
                    if (hitId !== -1 && minDist < CONFIG.CLICK_PARTICLE_RADIUS) {
                        if (hitId === currentMode) return;
                        clickLock = true;
                        currentMode = hitId;
                        if (currentMode > 0 && rec && !recStarted) tryStartRecognition();
                        updateUI();
                        forceUpdateParticles();
                    } else {
                        clickLock = false;
                        if (currentMode !== 0) { currentMode = 0;
                            updateUI();
                            forceUpdateParticles(); }
                    }
                }
                canvas.addEventListener('click', handleClick);
                canvas.addEventListener('touchstart', handleClick, { passive: false });
            }

            // ================================================================
            // 13. UI 更新
            // ================================================================
            function updateUI() {
                const panel = document.getElementById('info-panel');
                const descContainer = document.getElementById('info-desc');
                const config = DATA[currentMode];

                if (config && currentMode > 0) {
                    const titleEl = document.getElementById('info-title');
                    titleEl.innerText = config.name;
                    titleEl.style.color = config.uiHex;
                    titleEl.style.background = 'none';
                    titleEl.style.webkitBackgroundClip = 'unset';
                    titleEl.style.webkitTextFillColor = 'unset';

                    descContainer.innerHTML = "";
                    config.points.forEach((text, idx) => {
                        let html = text;
                        const kwCount = config.kws.length;
                        for (let i = 0; i < kwCount; i++) {
                            const isFound = config.status[i] || false;
                            const kw = config.kws[i] || '';
                            const displayKw = isFound ? kw : "( ? )";
                            const style = isFound ? "kw-found" : "kw-locked";
                            html = html.replace(new RegExp(`\\{${i}\\}`, 'g'),
                                `<span class="${style}">${displayKw}</span>`);
                        }
                        const item = document.createElement('div');
                        item.className = 'point-item';
                        item.style.borderLeftColor = config.uiHex;
                        item.innerHTML = html;
                        descContainer.appendChild(item);
                    });

                    if (currentMode === 6) {
                        panel.classList.add('layout-6');
                    } else {
                        panel.classList.remove('layout-6');
                    }
                    panel.classList.add('active');
                } else {
                    panel.classList.remove('active');
                }
            }

            // ================================================================
            // 14. 游戏控制
            // ================================================================
            function startGame() {
                // 重置状态
                for (let key in DATA) {
                    DATA[key].status = DATA[key].status.map(() => false);
                    UNLOCKED_STAGES[key] = false;
                }
                currentMode = 0;
                isVictory = false;
                victoryPlayed = false;
                allFinishedFlag = false;
                isGameFinished = false;
                gameActive = true;
                clickLock = false;

                document.getElementById('start-panel').classList.add('hidden');
                document.getElementById('btn-yellow').style.display = 'flex';

                startRecognition();
                startGuardian();

                timeLeft = CONFIG.GAME_DURATION;
                updateTimerDisplay();
                document.getElementById('timer-display').classList.remove('idle');
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        handleGameTimeout();
                    }
                }, 1000);

                updateUI();
                forceUpdateParticles();
                updateProgressDisplay();
                console.log('⏱️ 游戏开始，2分钟倒计时');
            }

            function updateTimerDisplay() {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                const display = document.getElementById('timer-display');
                display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                if (timeLeft <= 30) {
                    display.classList.add('warning');
                } else {
                    display.classList.remove('warning');
                }
            }

            // 获取未完成的关键词列表（用于超时记录）
            function getMissedItems() {
                const missed = [];
                for (let key in DATA) {
                    const item = DATA[key];
                    item.status.forEach((done, idx) => {
                        if (!done) {
                            missed.push(item.kws[idx]);
                        }
                    });
                }
                return missed;
            }

            function handleGameTimeout() {
                if (isGameFinished) return;
                isGameFinished = true;
                gameActive = false;
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                stopGuardian();
                const unlockedCount = Object.keys(DATA).filter(key => DATA[key].status.every(s => s === true)).length;
                const missed = getMissedItems();
                // 存入 Supabase（超时者）
                saveTimeoutRecord(playerName, playerSchool, missed);
                isVictory = true;
                document.getElementById('victory-sub').textContent = '⏰ 时间到！';
                document.getElementById('victory-score').textContent =
                    `📚 您已理解 ${unlockedCount}/${TOTAL_ITEMS} 个部分`;
                document.getElementById('victory-screen').classList.add('active');
                stopRecognition();
                clickLock = false;
                console.log(`⏰ 超时，已解锁 ${unlockedCount}/${TOTAL_ITEMS}`);
            }

            // ================================================================
            // 15. 排行榜
            // ================================================================
            async function renderLeaderboard() {
                const container = document.getElementById('leaderboard-list');
                const allData = await getLeaderboardData();
                const pageSize = CONFIG.LB_PAGE_SIZE;
                const totalPages = Math.max(1, Math.ceil(allData.length / pageSize));
                if (lbCurrentPage > totalPages) lbCurrentPage = totalPages;
                if (lbCurrentPage < 1) lbCurrentPage = 1;

                const start = (lbCurrentPage - 1) * pageSize;
                const pageData = allData.slice(start, start + pageSize);

                if (allData.length === 0) {
                    container.innerHTML = '<div class="leaderboard-empty">暂无完成记录的玩家。</div>';
                } else {
                    let html = '';
                    pageData.forEach((r, idx) => {
                        const rank = start + idx + 1;
                        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}.`;
                        html += `<div class="lb-item">
                            <span class="rank">${medal}</span>
                            <span class="name">${escapeHtml(r.name)}</span>
                            <span class="score">${r.score} 秒</span>
                        </div>`;
                    });
                    container.innerHTML = html;
                }

                document.getElementById('lb-page-info').textContent = `${lbCurrentPage} / ${totalPages}`;
                document.getElementById('lb-prev').disabled = (lbCurrentPage <= 1);
                document.getElementById('lb-next').disabled = (lbCurrentPage >= totalPages);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ================================================================
            // 16. 黄色按钮
            // ================================================================
            function setupYellowButton() {
                document.getElementById('btn-yellow').addEventListener('click', () => {
                    initAudio();
                    clickLock = false;
                    if (currentMode === 1) {
                        currentMode = 0;
                    } else {
                        currentMode = 1;
                    }
                    updateUI();
                    forceUpdateParticles();
                });
            }

            // ================================================================
            // 17. 动画循环
            // ================================================================
            function animate() {
                requestAnimationFrame(animate);
                if (!particles) return;

                const targetMorph = (currentMode !== 0) ? 1 : 0;
                const targetSelect = (currentMode !== 0) ? 1 : 0;
                morphFactor += (targetMorph - morphFactor) * 0.2;
                selectFactor += (targetSelect - selectFactor) * 0.2;

                const posAttr = particles.geometry.attributes.position;
                const colAttr = particles.geometry.attributes.color;

                for (let i = 0; i < particleMeta.length; i++) {
                    const m = particleMeta[i];
                    let tx = m.ox,
                        ty = m.oy,
                        tz = 0,
                        br = 1.0;

                    if (currentMode >= 1 && currentMode <= 5) {
                        const isMatch = (m.type === currentMode || (currentMode === 1 && (m.type === 5 || m.type ===
                            7)));
                        if (isMatch) {
                            tx = m.ox * 0.8;
                            ty = m.oy * 0.8 + 80;
                            tz = 180;
                        } else {
                            tz = -600;
                            br = 0.1;
                        }
                    } else if (currentMode === 6) {
                        if (m.type === 3 || m.type === 4) {
                            tx = m.ox * 0.5 - 320;
                            ty = m.oy * 0.5 - 180;
                        } else if (m.type === 7) {
                            tx = m.ox * 1.2 - 120;
                            ty = m.oy * 1.2 + 40;
                            tz = 100;
                        } else {
                            tz = -600;
                            br = 0.1;
                        }
                    }

                    const isLit = UNLOCKED_STAGES[m.unlockId] || false;
                    let r, g, b;
                    if (isLit) {
                        r = m.r;
                        g = m.g;
                        b = m.b;
                    } else {
                        const gray = (m.r + m.g + m.b) / 3 * 0.25;
                        r = g = b = gray;
                    }

                    const cX = posAttr.getX(i),
                        cY = posAttr.getY(i),
                        cZ = posAttr.getZ(i);
                    posAttr.setXYZ(i, cX + (tx - cX) * 0.15, cY + (ty - cY) * 0.15, cZ + (tz - cZ) * 0.15);
                    colAttr.setXYZ(i, r * br, g * br, b * br);
                }
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                renderer.render(scene, camera);
            }

            // ================================================================
            // 18. 窗口自适应 & 全屏
            // ================================================================
            window.addEventListener('resize', () => {
                if (camera) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            function toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
            window.toggleFullScreen = toggleFullScreen;

            // ================================================================
            // 19. 启动
            // ================================================================
            async function boot() {
                initScene();
                await loadFlag();
                animate();

                setupYellowButton();

                const step1Btn = document.getElementById('btn-step1');
                const nameInput = document.getElementById('player-name');
                const schoolInput = document.getElementById('player-school');
                const step2Btn = document.getElementById('btn-step2');

                function handleStep1() {
                    const name = nameInput.value.trim();
                    const school = schoolInput.value.trim();
                    if (!name || !school) {
                        alert('请输入您的姓名和学校。');
                        return;
                    }
                    playerName = name;
                    playerSchool = school;

                    document.getElementById('step1-card').style.display = 'none';
                    document.getElementById('step2-card').style.display = 'block';

                    initAudio();
                    startGestureOnly();
                }

                step1Btn.addEventListener('click', handleStep1);
                nameInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleStep1();
                });
                schoolInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleStep1();
                });

                step2Btn.addEventListener('click', startGame);

                document.getElementById('close-panel').addEventListener('click', () => {
                    document.getElementById('info-panel').classList.remove('active');
                });

                document.getElementById('btn-replay-ui').addEventListener('click', () => {
                    playDing();
                    setTimeout(() => location.reload(), 300);
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'f' || e.key === 'F') toggleFullScreen();
                });

                // 超时保护：如果摄像头加载超过5秒，仍然启用开始按钮
                setTimeout(() => {
                    if (step2Btn.disabled) {
                        step2Btn.disabled = false;
                        step2Btn.textContent = '🚀 开始挑战 (请等待)';
                    }
                }, 5000);

                // 点击处理在渲染器准备好后绑定
                setTimeout(setupClickHandler, 100);

                // ===== 排行榜 =====
                document.getElementById('btn-leaderboard').addEventListener('click', async () => {
                    lbCurrentPage = 1;
                    await renderLeaderboard();
                    document.getElementById('leaderboard-panel').classList.add('active');
                });
                document.getElementById('btn-close-lb').addEventListener('click', () => {
                    document.getElementById('leaderboard-panel').classList.remove('active');
                });
                document.getElementById('leaderboard-panel').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) {
                        document.getElementById('leaderboard-panel').classList.remove('active');
                    }
                });
                document.getElementById('lb-prev').addEventListener('click', async () => {
                    if (lbCurrentPage > 1) { lbCurrentPage--;
                        await renderLeaderboard(); }
                });
                document.getElementById('lb-next').addEventListener('click', async () => {
                    const allData = await getLeaderboardData();
                    const total = Math.ceil(allData.length / CONFIG.LB_PAGE_SIZE);
                    if (lbCurrentPage < total) { lbCurrentPage++;
                        await renderLeaderboard(); }
                });

                // ===== 隐藏后台已移除 =====
            }

            window.onload = boot;
        })();
    </script>
