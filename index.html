<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>辉煌条纹 - 3分钟挑战</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 完整样式（与之前完全相同，未做任何改动） */
        :root {
            --void: #050508;
            --void-2: #0b0c14;
            --panel: #101018;
            --panel-2: #14141f;
            --gold: #ffcc00;
            --gold-bright: #ffd700;
            --gold-dim: #b8960a;
            --gold-line: rgba(255, 204, 0, 0.4);
            --blue: #003366;
            --blue-bright: #1a4f8a;
            --blue-dim: #002244;
            --blue-line: rgba(0, 51, 102, 0.5);
            --maroon: #7d2836;
            --maroon-bright: #e0576e;
            --teal: #1c8a7c;
            --ivory: #f6efdc;
            --ink: #d8cfba;
            --ink-dim: #7d7461;
            --font-display: 'Fraunces', 'Georgia', serif;
            --font-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body {
            margin:0; overflow:hidden; background:var(--void);
            font-family:var(--font-body); color:var(--ivory);
            touch-action:none; position:relative;
        }
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background:radial-gradient(ellipse 900px 600px at 15% -5%, rgba(255,204,0,0.12), transparent 60%),
                     radial-gradient(ellipse 700px 700px at 105% 105%, rgba(0,51,102,0.18), transparent 60%),
                     radial-gradient(ellipse 1400px 900px at 50% 50%, rgba(255,204,0,0.03), transparent 70%);
            animation:ambientBreathe 12s ease-in-out infinite alternate;
        }
        body::after {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            opacity:0.5;
            background-image:radial-gradient(rgba(255,255,255,0.045) 0.6px, transparent 0.6px);
            background-size:3px 3px; mix-blend-mode:overlay;
        }
        @keyframes ambientBreathe { 0% { opacity:0.75; } 100% { opacity:1; } }

        #status-bar {
            position:absolute; top:24px; left:24px; z-index:1000;
            background:linear-gradient(155deg, var(--panel-2), var(--panel) 80%);
            border:1px solid var(--blue-line); border-radius:16px;
            padding:18px 24px 16px; min-width:236px;
            box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 0 1px rgba(0,0,0,0.5);
            display:flex; flex-direction:column; gap:12px;
            transition:opacity 0.3s;
        }
        .status-row { display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .status-title {
            font-family:var(--font-display); font-size:19px; font-weight:600;
            letter-spacing:0.5px;
            background:linear-gradient(120deg, var(--ivory), var(--gold-bright) 65%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            cursor:default; user-select:none;
        }
        .status-title.dbl-click-hint { cursor:pointer; }
        .status-title.dbl-click-hint::after { content:'⏎'; font-size:10px; color:#555; margin-left:4px; opacity:0.3; }
        .status-timer {
            position:relative; font-family:var(--font-mono); font-size:19px; font-weight:700;
            width:78px; height:78px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-variant-numeric:tabular-nums; color:var(--ivory); letter-spacing:0.5px;
            background:radial-gradient(circle at 35% 28%, #1a2a3f, #08080c 72%);
            box-shadow:inset 0 0 0 2px rgba(255,204,0,0.55), inset 0 0 14px rgba(0,0,0,0.6), 0 0 0 5px rgba(255,204,0,0.06);
        }
        .status-timer::before {
            content:''; position:absolute; inset:-8px; border-radius:50%;
            background-image:repeating-conic-gradient(var(--gold) 0deg 2.5deg, transparent 2.5deg 9deg);
            -webkit-mask-image:radial-gradient(circle, transparent 41px, #000 42px, #000 45px, transparent 46px);
            mask-image:radial-gradient(circle, transparent 41px, #000 42px, #000 45px, transparent 46px);
            opacity:0.75; animation:dialSpin 40s linear infinite;
        }
        @keyframes dialSpin { to { transform:rotate(360deg); } }
        .status-timer.warning { color:var(--maroon-bright); animation:pulse 0.6s infinite alternate; }
        .status-timer.warning::before { background-image:repeating-conic-gradient(var(--maroon-bright) 0deg 2.5deg, transparent 2.5deg 9deg); }
        .status-timer.idle { opacity:0.4; }
        @keyframes pulse { 0% { opacity:0.7; transform:scale(0.98); } 100% { opacity:1; transform:scale(1.04); } }
        .status-hint { font-size:11.5px; color:var(--ink-dim); letter-spacing:0.3px; }
        .status-hint span { display:inline-block; margin-right:10px; }
        .status-actions { display:flex; gap:8px; align-items:center; }
        #btn-leaderboard {
            background:none; border:1px solid transparent; color:var(--gold-dim);
            font-size:20px; cursor:pointer; padding:3px 7px; border-radius:6px;
            transition:0.2s; opacity:0.8; line-height:1;
        }
        #btn-leaderboard:hover { background:rgba(255,204,0,0.1); border-color:var(--gold-line); color:var(--gold-bright); opacity:1; transform:scale(1.1); }
        #mic-status { display:inline-block !important; font-size:18px; line-height:1; animation:micPulse 1.5s infinite; }
        @keyframes micPulse { 0% { opacity:0.4; } 50% { opacity:1; } 100% { opacity:0.4; } }
        #camera-error { font-size:11px; color:#ff6b6b; margin-top:4px; display:none; text-align:left; }
        #global-toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); color:var(--ivory);
            padding:14px 28px; border-radius:40px; border:1px solid var(--gold-line);
            font-size:15px; z-index:9999; opacity:0; transition:opacity 0.4s ease;
            pointer-events:none; font-weight:500; box-shadow:0 10px 40px rgba(0,0,0,0.7);
            max-width:90%; text-align:center;
        }
        #global-toast.show { opacity:1; }
        #speech-fallback {
            position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
            z-index:9998; display:none; align-items:center; gap:10px;
            background:rgba(10,10,20,0.9); backdrop-filter:blur(12px);
            padding:12px 20px; border-radius:60px; border:1px solid var(--gold-line);
            box-shadow:0 10px 40px rgba(0,0,0,0.8); width:90%; max-width:420px;
        }
        #speech-fallback input { flex:1; background:transparent; border:none; color:var(--ivory); font-size:16px; padding:8px 4px; outline:none; font-family:var(--font-body); }
        #speech-fallback input::placeholder { color:var(--ink-dim); }
        #speech-fallback button {
            background:var(--gold); border:none; color:#16110a; font-weight:700;
            padding:8px 20px; border-radius:40px; cursor:pointer; font-size:14px;
            transition:0.2s; font-family:var(--font-display); flex-shrink:0;
        }
        #speech-fallback button:hover { transform:scale(1.05); }
        #speech-fallback button:active { transform:scale(0.95); }

        #btn-yellow {
            position:absolute; bottom:120px; left:24px; z-index:999;
            background:linear-gradient(135deg, #ffcc00, #e6b800); border:2px solid #b8960a;
            border-radius:60px; color:#1a1500; font-size:16px; font-weight:800;
            padding:14px 28px; cursor:pointer; box-shadow:0 8px 30px rgba(255,204,0,0.35);
            transition:all 0.25s ease; touch-action:manipulation; letter-spacing:0.5px;
            font-family:var(--font-display); display:none; align-items:center; gap:10px;
        }
        #btn-yellow::before { content:'🟡'; font-size:22px; }
        #btn-yellow:hover { transform:scale(1.06); box-shadow:0 12px 40px rgba(255,204,0,0.6); }
        #btn-yellow:active { transform:scale(0.95); }
        #btn-yellow.active-mode { border-color:#fff; box-shadow:0 0 30px rgba(255,204,0,0.8), 0 0 60px rgba(255,204,0,0.3); }

        #start-panel {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:5000;
            background:rgba(2,2,5,0.78); backdrop-filter:blur(22px) saturate(1.15);
            display:flex; align-items:center; justify-content:center;
            transition:opacity 0.5s ease;
        }
        #start-panel.hidden { opacity:0; pointer-events:none; }
        .start-card {
            background:linear-gradient(165deg, var(--panel-2), #08080d 88%);
            border:1px solid var(--blue-line); border-radius:28px;
            padding:56px 44px 40px; max-width:560px; width:92%;
            box-shadow:0 40px 100px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,204,0,0.06) inset;
            text-align:center; position:relative; transition:opacity 0.4s, transform 0.4s;
        }
        .start-card::after {
            content:''; position:absolute; inset:0;
            background:radial-gradient(circle at 50% -8%, rgba(255,204,0,0.14), transparent 55%);
            pointer-events:none; border-radius:28px;
        }
        .start-card .icon {
            position:relative; display:inline-flex; align-items:center; justify-content:center;
            width:108px; height:108px; margin:0 auto 18px; font-size:46px;
            filter:drop-shadow(0 0 16px rgba(255,204,0,0.4));
        }
        .start-card .icon::before {
            content:''; position:absolute; inset:0; border-radius:50%;
            border:1.5px solid var(--gold-line);
            background:radial-gradient(circle at 40% 30%, rgba(255,204,0,0.14), rgba(0,0,0,0) 70%);
        }
        .start-card .icon::after {
            content:''; position:absolute; inset:-10px; border-radius:50%;
            background-image:repeating-conic-gradient(var(--gold) 0deg 3deg, transparent 3deg 12deg);
            -webkit-mask-image:radial-gradient(circle, transparent 52px, #000 53px, #000 56px, transparent 57px);
            mask-image:radial-gradient(circle, transparent 52px, #000 53px, #000 56px, transparent 57px);
            opacity:0.7; animation:dialSpin 50s linear infinite;
        }
        .start-card h1 {
            font-family:'Times New Roman', Times, serif;
            font-size:clamp(40px, 8vw, 50px); font-weight:700; letter-spacing:1px;
            margin:0 0 6px 0;
            background:linear-gradient(180deg, var(--ivory) 20%, var(--gold-bright) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; position:relative;
        }
        .start-card .sub {
            font-family:'Times New Roman', Times, serif; color:var(--ink-dim);
            font-size:11px; letter-spacing:4px; text-transform:uppercase; margin-bottom:30px; position:relative;
        }
        .start-card .sub::before, .start-card .sub::after {
            content:'◆'; color:var(--gold-dim); font-size:6px; margin:0 10px; vertical-align:middle;
        }
        .start-card .input-group { display:flex; flex-direction:column; gap:14px; margin-bottom:26px; position:relative; }
        .start-card .input-group input {
            padding:16px 20px; border-radius:12px; border:1px solid rgba(255,204,0,0.2);
            border-bottom:2px solid var(--gold-line); background:rgba(255,255,255,0.025);
            color:var(--ivory); font-family:var(--font-body); font-size:17px; outline:none; transition:0.25s;
        }
        .start-card .input-group input:focus {
            border-color:var(--gold); background:rgba(255,204,0,0.07);
            box-shadow:0 0 0 3px rgba(255,204,0,0.14);
        }
        .start-card .input-group input::placeholder { color:#625c4e; font-weight:300; }
        .start-card .rules {
            background:rgba(255,255,255,0.025); border-radius:12px; padding:18px 22px;
            margin:6px 0 28px; text-align:left; font-size:14px; line-height:1.85;
            color:var(--ink); border-left:2px solid var(--gold); position:relative;
        }
        .start-card .rules strong { color:var(--gold-bright); font-weight:600; }
        .btn-start {
            position:relative; background:linear-gradient(120deg, var(--gold-bright), var(--gold) 55%, var(--gold-dim));
            border:none; color:#16110a; padding:18px 48px; border-radius:60px;
            font-family:var(--font-display); font-size:21px; font-weight:700; cursor:pointer;
            transition:0.25s; letter-spacing:1.5px; touch-action:manipulation; width:100%; overflow:hidden;
        }
        .btn-start::after {
            content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
            background:linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
            animation:sheen 3.2s ease-in-out infinite;
        }
        @keyframes sheen { 0% { left:-60%; } 45%,100% { left:130%; } }
        .btn-start:hover, .btn-start:active { transform:scale(1.02); box-shadow:0 14px 40px rgba(255,204,0,0.45); }
        .btn-start:disabled { opacity:0.5; transform:none; box-shadow:none; cursor:not-allowed; }
        .start-card .footnote { font-size:12px; color:var(--ink-dim); margin-top:18px; letter-spacing:0.3px; }
        .step-indicator { display:flex; justify-content:center; gap:14px; margin-bottom:26px; }
        .step-dot { width:26px; height:5px; background:#232330; transition:0.3s; border-radius:4px; }
        .step-dot.active { background:linear-gradient(90deg, var(--gold), var(--gold-bright)); box-shadow:0 0 12px rgba(255,204,0,0.5); }
        .step-dot.done { background:var(--gold-dim); }

        #camera-loading {
            font-size:14px; color:var(--gold-dim); margin:10px 0; display:none;
            animation:pulse 1.2s infinite;
        }
        #camera-loading.show { display:block; }

        #info-panel {
            position:absolute; bottom:34px; left:50%; transform:translateX(-50%) translateY(30px);
            width:88%; max-width:820px;
            background:linear-gradient(160deg, var(--panel-2), var(--panel));
            border:2px solid #ffcc00; border-radius:24px; padding:32px 36px 28px;
            text-align:center; opacity:0; transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
            pointer-events:none; box-shadow:0 20px 70px rgba(0,0,0,0.8); z-index:1500;
        }
        #info-panel.active { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
        #info-panel.layout-6 { left:72%; width:35%; max-width:500px; bottom:50%; transform:translate(-50%,50%); text-align:left; align-items:flex-start; }
        #info-panel.layout-6.active { transform:translate(-50%,50%); }
        #info-title { margin:4px 0 14px 0; font-family:var(--font-display); font-size:clamp(24px,4.2vw,38px); font-weight:700; }
        #info-desc { font-size:clamp(17px,2.6vw,24px); line-height:1.75; color:#fff; font-weight:400; }
        .kw-locked { color:#555; text-decoration:underline dotted rgba(125,116,97,0.6); }
        .kw-found { color:#ffcc00; font-weight:700; text-shadow:0 0 10px rgba(255,204,0,0.5); }
        .desc-container { display:flex; justify-content:center; gap:20px; width:100%; flex-wrap:wrap; }
        #info-panel.layout-6 .desc-container { flex-direction:column; }
        .point-item { flex:1; min-width:200px; font-size:clamp(17px,2.4vw,22px); line-height:1.6; background:rgba(255,255,255,0.03); padding:16px 20px; border-radius:12px; border-left:4px solid transparent; color:#fff; }
        #close-panel { position:absolute; top:16px; right:24px; background:none; border:none; color:var(--ink-dim); font-size:22px; cursor:pointer; transition:0.2s; padding:0 6px; touch-action:manipulation; }
        #close-panel:hover { color:var(--gold-bright); transform:rotate(90deg); }

        #victory-screen {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.6);
            background:linear-gradient(160deg,#0a1420,#05080c 85%); border:2px solid #ffcc00;
            border-radius:40px; padding:64px 56px 44px; text-align:center;
            box-shadow:0 40px 130px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,204,0,0.1);
            z-index:3000; opacity:0; pointer-events:none;
            transition:all 0.6s cubic-bezier(0.22,1,0.36,1); max-width:90vw;
        }
        #victory-screen.active { opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
        #victory-screen .trophy { font-size:46px; margin-top:-32px; margin-bottom:10px; filter:drop-shadow(0 0 24px rgba(255,204,0,0.6)); }
        #victory-screen h1 {
            margin:0; font-family:var(--font-display); font-size:clamp(38px,7vw,62px); font-weight:800;
            background:linear-gradient(to bottom, var(--ivory) 20%, var(--gold) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:3px;
        }
        #victory-screen .sub { font-size:clamp(15px,2vw,20px); color:var(--ink); margin:12px 0 24px; font-family:var(--font-body); }
        .victory-score { display:inline-block; font-family:var(--font-mono); font-size:22px; color:var(--gold-bright); margin-bottom:30px; font-weight:700; padding:10px 22px; border:1px solid var(--gold-line); border-radius:12px; }
        #btn-replay-ui { display:inline-block; position:relative; padding:16px 44px; border:1px solid var(--gold); border-radius:60px; color:var(--gold-bright); font-family:var(--font-display); font-size:clamp(16px,2vw,20px); font-weight:700; letter-spacing:0.5px; transition:0.25s; cursor:pointer; touch-action:manipulation; background:rgba(255,204,0,0.07); }
        #btn-replay-ui:hover, #btn-replay-ui:active { background:var(--gold-bright); color:#16110a; transform:scale(1.05); box-shadow:0 10px 34px rgba(255,204,0,0.4); }

        #leaderboard-panel {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:7000;
            background:rgba(0,0,0,0.7); backdrop-filter:blur(18px);
            display:none; align-items:center; justify-content:center; padding:20px;
        }
        #leaderboard-panel.active { display:flex; }
        .leaderboard-card {
            background:linear-gradient(165deg, var(--panel-2), #0a0a10);
            border:1px solid var(--gold-line); border-radius:28px; padding:32px 36px;
            max-width:540px; width:100%; max-height:80vh;
            box-shadow:0 30px 90px rgba(0,0,0,0.9); display:flex; flex-direction:column;
        }
        .leaderboard-card h2 { color:var(--gold-bright); font-family:var(--font-display); font-size:28px; margin:0 0 16px 0; text-align:center; font-weight:600; border-bottom:1px solid rgba(255,204,0,0.2); padding-bottom:14px; letter-spacing:0.5px; }
        .leaderboard-card .lb-list { flex:1; overflow-y:auto; padding-right:4px; }
        .leaderboard-card .lb-item { display:flex; justify-content:space-between; padding:10px 6px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:16px; }
        .leaderboard-card .lb-item .rank { color:var(--ink-dim); font-weight:500; min-width:40px; }
        .leaderboard-card .lb-item .name { color:var(--ivory); flex:1; margin-left:8px; }
        .leaderboard-card .lb-item .score { color:var(--gold-bright); font-weight:600; min-width:70px; text-align:right; }
        .leaderboard-empty { text-align:center; color:var(--ink-dim); padding:40px 0; font-size:18px; font-family:var(--font-display); }
        .lb-pagination { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:18px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06); }
        .lb-pagination button { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--ink); padding:6px 18px; border-radius:30px; cursor:pointer; font-size:14px; transition:0.2s; }
        .lb-pagination button:hover:not(:disabled) { background:rgba(255,204,0,0.15); border-color:var(--gold-line); color:var(--gold-bright); }
        .lb-pagination button:disabled { opacity:0.3; cursor:not-allowed; }
        .lb-pagination span { color:var(--ink-dim); font-size:14px; }
        .btn-close-lb { display:block; margin:16px auto 0; background:rgba(255,255,255,0.04); color:var(--ink); border:1px solid rgba(255,255,255,0.1); border-radius:40px; padding:10px 32px; font-size:15px; cursor:pointer; transition:0.2s; touch-action:manipulation; }
        .btn-close-lb:hover { background:rgba(255,204,0,0.12); border-color:var(--gold-line); color:var(--gold-bright); }

        #records-panel {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:6000;
            background:rgba(0,0,0,0.75); backdrop-filter:blur(18px);
            display:none; align-items:center; justify-content:center; padding:20px;
        }
        #records-panel.active { display:flex; }
        .records-card {
            background:linear-gradient(165deg, var(--panel-2), #0a0a10);
            border:1px solid var(--gold-line); border-radius:28px; padding:12px 36px 32px;
            max-width:840px; width:100%; max-height:80vh;
            display:flex; flex-direction:column; box-shadow:0 30px 90px rgba(0,0,0,0.9); position:relative;
        }
        .records-card h2 { color:var(--gold-bright); font-family:var(--font-display); font-size:26px; margin:22px 0 20px 0; text-align:center; font-weight:600; border-bottom:1px solid rgba(255,204,0,0.2); padding-bottom:16px; letter-spacing:0.5px; }
        .records-tabs { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
        .records-tabs button { background:transparent; border:1px solid rgba(255,255,255,0.08); color:var(--ink-dim); padding:6px 20px; border-radius:40px; cursor:pointer; font-size:14px; font-family:var(--font-body); transition:0.2s; }
        .records-tabs button.active { border-color:var(--gold); color:var(--gold-bright); background:rgba(255,204,0,0.08); }
        .records-tabs button:hover { border-color:var(--gold-line); color:var(--ivory); }
        .records-list-container { flex:1; overflow-y:auto; margin-bottom:12px; }
        .records-table { width:100%; border-collapse:collapse; font-size:14px; }
        .records-table th { background:rgba(255,204,0,0.09); color:var(--gold-bright); padding:12px 10px; text-align:left; font-weight:600; letter-spacing:0.3px; border-bottom:2px solid rgba(255,204,0,0.3); position:sticky; top:0; z-index:2; }
